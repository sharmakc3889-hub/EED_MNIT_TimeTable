// Renders a printable timetable page in the style of the institute's official
// timetable proforma: header with logo/institute/department, faculty-or-class
// meta line, a Day × Period grid (days as rows, periods as columns, with the
// lunch break as its own column), a subject summary table, and a signature
// footer. Used for the "Download PDF" flow (browser print → Save as PDF).
function PrintableTimetable({ payload, data, session, wef }) {
  const days = useMemo(() => getDays(data), [data.daysPerWeek]);
  const sch = getScheduleForClass(data, payload.mode === "class" ? payload.classId : null);
  const now = useMemo(() => new Date(), []);

  if (payload.type !== "grid") {
    // Non-grid search results (course-wise / day-time snapshots) get a simpler,
    // still-branded print layout rather than the full Day×Period proforma.
    return (
      <div>
        <PrintHeader data={data} />
        <h2 className="print-title">{payload.title}</h2>
        <p className="print-meta">Academic session {session} ({wef === "odd" ? "Odd" : "Even"} semester) · Generated {now.toLocaleDateString()}</p>
        <table className="print-table">
          <thead>
            <tr>{payload.columns.map((c) => <th key={c.key}>{c.label}</th>)}</tr>
          </thead>
          <tbody>
            {payload.rows.map((row, i) => (
              <tr key={i}>{payload.columns.map((c) => <td key={c.key}>{row[c.key]}</td>)}</tr>
            ))}
          </tbody>
        </table>
        <PrintFooter />
      </div>
    );
  }

  const periodsCount = payload.periodsCount;
  // Build the column list: one per period, with a "Lunch" column spliced in
  // at the configured position — mirroring the official proforma.
  const periodCols = Array.from({ length: periodsCount }, (_, p) => ({ kind: "period", index: p, label: periodLabel(p, sch) }));
  if (sch.lunchEnabled) periodCols.splice(sch.lunchAfter, 0, { kind: "lunch", label: lunchTimeLabel(sch) });

  const entries = payload.entries;
  const usedSubjectIds = Array.from(new Set(entries.filter((e) => !e.isLunch).map((e) => e.subjectId)));
  const summaryRows = usedSubjectIds.map((sid) => {
    const subject = data.subjects.find((s) => s.id === sid);
    const own = entries.filter((e) => e.subjectId === sid);
    const rooms = Array.from(new Set(own.map((e) => data.rooms.find((r) => r.id === e.roomId)?.name).filter(Boolean)));
    const classLabels = Array.from(new Set(own.map((e) => className(data.classes.find((c) => c.id === e.classId), data.departments))));
    const facultyLabels = Array.from(new Set(own.map((e) => {
      const fName = data.faculty.find((f) => f.id === e.facultyId)?.name;
      if (!fName) return null;
      const b = batchLabel(e, data);
      return b ? `${b}: ${fName}` : fName;
    }).filter(Boolean)));
    const classFacultyPairs = Array.from(new Set(own.map((e) => {
      const cLabel = className(data.classes.find((c) => c.id === e.classId), data.departments);
      const fLabel = data.faculty.find((f) => f.id === e.facultyId)?.name;
      const b = batchLabel(e, data);
      const facPart = fLabel ? (b ? `${b}: ${fLabel}` : fLabel) : null;
      return facPart ? `${cLabel} (${facPart})` : cLabel;
    })));
    // Hours actually scheduled in the timetable, not the nominal hoursPerWeek
    // target from Setup. Parallel batches of this subject sharing the same
    // class/day/period (or classes sharing a combined slot) are one teaching
    // period, not one per batch/class, so dedupe by classId+day+period before
    // summing each slot's span.
    const seenSlots = new Set();
    let hours = 0;
    own.forEach((e) => {
      const slotKey = `${e.classId}-${e.day}-${e.period}`;
      if (seenSlots.has(slotKey)) return;
      seenSlots.add(slotKey);
      hours += e.span || 1;
    });
    return {
      id: sid,
      abbr: subjectAbbr(subject),
      code: subject?.code || "—",
      name: subject?.name || "—",
      hours,
      type: typeLabel(subject?.classType),
      rooms: rooms.join(", ") || "—",
      classes: payload.mode === "class"
        ? (facultyLabels.join(", ") || "—")
        : payload.showFaculty
          ? (classFacultyPairs.join(", ") || "—")
          : (classLabels.join(", ") || "—"),
    };
  });

  const nonMappingRows = payload.mode === "class" && payload.classId
    ? data.assignments
        .filter((a) => a.classId === payload.classId)
        .map((a) => ({ assignment: a, subject: data.subjects.find((s) => s.id === a.subjectId), faculty: data.faculty.find((f) => f.id === a.facultyId) }))
        .filter((row) => isNonMappingType(row.subject?.classType))
        .map((row) => ({
          id: row.assignment.id,
          code: row.subject?.code || "—",
          name: row.subject?.name || "—",
          hours: row.subject?.hoursPerWeek ?? "—",
          type: typeLabel(row.subject?.classType),
          faculty: row.faculty?.name || "—",
        }))
    : [];

  return (
    <div>
      <PrintHeader data={data} />
      <p className="print-meta-line">
        {payload.subtitleLabel && <span>{payload.subtitleLabel}</span>}
        <span>Session: {session} ({wef === "odd" ? "Odd" : "Even"})</span>
        <span>Last Locked on: {now.toLocaleString()}</span>
      </p>

      <table className="print-table print-grid">
        <thead>
          <tr>
            <th>Day/Period</th>
            {periodCols.map((col, i) => (
              <th key={i}>{col.kind === "lunch" ? "Lunch" : `P${col.index + 1}`}<br /><span className="print-time">{col.label}</span></th>
            ))}
          </tr>
        </thead>
        <tbody>
          {days.map((day) => (
            <tr key={day}>
              <td className="print-day-cell">{day}</td>
              {periodCols.map((col, i) => {
                if (col.kind === "lunch") return <td key={i} className="print-lunch-cell">Lunch</td>;
                const cellEntries = entries.filter((e) => e.day === day && e.period === col.index);
                if (cellEntries.some((e) => e.isLunch)) return <td key={i} className="print-lunch-cell">Lunch</td>;
                return (
                  <td key={i}>
                    {groupCellEntries(cellEntries).map((group) => {
                      const subject = data.subjects.find((s) => s.id === group.subjectId);
                      return (
                        <div key={group.subjectId} className="print-cell-entry">
                          <div className="print-cell-abbr">{subjectAbbr(subject)}</div>
                          {group.items.map((entry) => {
                            const room = data.rooms.find((r) => r.id === entry.roomId);
                            const cls = data.classes.find((c) => c.id === entry.classId);
                            const fac = data.faculty.find((f) => f.id === entry.facultyId);
                            const batch = batchLabel(entry, data);
                            const isLab = subject?.classType === "lab";
                            // Technician names for this cell: the session-specific
                            // explicit pick or the lab's default in-charge (legacy,
                            // single technician), merged with every technician
                            // assigned to this exact room + batch combination via
                            // Setup > Lab/Batch ↔ technician assignment (many-to-many,
                            // like scholars) — deduplicated.
                            const legacyTechId = entry.technicianId || (payload.showLabStaff && isLab && payload.mode !== "class" ? room?.technicianId : null);
                            const technicianNames = payload.showLabStaff && isLab && payload.mode !== "class"
                              ? Array.from(new Set([
                                  ...(legacyTechId ? [data.technicians?.find((t) => t.id === legacyTechId)?.name] : []),
                                  ...(data.technicianAssignments || [])
                                    .filter((a) => a.roomId === entry.roomId && (a.batch || "") === batch)
                                    .map((a) => data.technicians.find((t) => t.id === a.technicianId)?.name),
                                ].filter(Boolean))).filter((name) => name !== data.technicians.find((t) => t.id === payload.excludeTechnicianId)?.name)
                              : [];
                            // Scholars aren't stored on the entry itself — look up
                            // whichever scholar(s) are assigned (Setup > Lab/Batch ↔
                            // scholar) to this exact room + batch combination. Keep
                            // each scholar's degree (PhD/MTech) so they can be
                            // printed in different colors.
                            const scholarNames = payload.showLabStaff && isLab && payload.mode !== "class"
                              ? Array.from(new Map(
                                  (data.scholarAssignments || [])
                                    .filter((a) => a.roomId === entry.roomId && (a.batch || "") === batch)
                                    .map((a) => data.scholars.find((s) => s.id === a.scholarId))
                                    .filter((s) => s && s.name)
                                    .map((s) => [s.name, s.degree || "PhD"])
                                ).entries()).filter(([name]) => name !== data.scholars.find((s) => s.id === payload.excludeScholarId)?.name)
                              : [];
                            const tagLabel = payload.mode === "class"
                              ? null
                              : payload.showFaculty
                                ? `${className(cls, data.departments)} · ${fac?.name || "—"}`
                                : className(cls, data.departments);
                            return (
                              <div key={entry.id} className="print-cell-room">
                                {batch && <span className="print-cell-batch">{batch}: </span>}({room?.name || "—"}){tagLabel ? ` [${tagLabel}]` : ""}
                                {technicianNames.length > 0 && <span className="print-cell-tech"> · Tech: {technicianNames.join(", ")}</span>}
                                {scholarNames.length > 0 && (
                                  <span className="print-cell-scholar">
                                    {" "}· Scholar: {scholarNames.map(([sName, sDegree], i) => (
                                      <React.Fragment key={sName}>
                                        {i > 0 && ", "}
                                        <span className={sDegree === "MTech" ? "print-cell-scholar-mtech" : "print-cell-scholar-phd"}>{sName}</span>
                                      </React.Fragment>
                                    ))}
                                  </span>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      );
                    })}
                  </td>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>

      <p className="print-summary-title">Summary</p>
      <table className="print-table print-summary">
        <thead>
          <tr>
            <th>Abbreviation</th><th>Subject Code</th><th>Subject Name</th><th>Hours</th><th>Subject Type</th><th>Room No</th><th>{payload.mode === "class" ? "Faculty" : payload.showFaculty ? "Class (Faculty)" : "Class"}</th>
          </tr>
        </thead>
        <tbody>
          {summaryRows.length === 0 && (
            <tr><td colSpan={7} className="print-empty">No sessions in this timetable yet.</td></tr>
          )}
          {summaryRows.map((r) => (
            <tr key={r.id}>
              <td>{r.abbr}</td><td>{r.code}</td><td>{r.name}</td><td>{r.hours}</td><td>{r.type}</td><td>{r.rooms}</td><td>{r.classes}</td>
            </tr>
          ))}
        </tbody>
      </table>

      {payload.mode === "class" && nonMappingRows.length > 0 && (
        <React.Fragment>
          <p className="print-summary-title">Non-time-tabled subjects</p>
          <table className="print-table print-summary">
            <thead>
              <tr><th>Subject Code</th><th>Subject Name</th><th>Hours</th><th>Subject Type</th><th>Faculty</th></tr>
            </thead>
            <tbody>
              {nonMappingRows.map((r) => (
                <tr key={r.id}><td>{r.code}</td><td>{r.name}</td><td>{r.hours}</td><td>{r.type}</td><td>{r.faculty}</td></tr>
              ))}
            </tbody>
          </table>
        </React.Fragment>
      )}

      <PrintFooter />
    </div>
  );
}

function PrintHeader({ data }) {
  return (
    <div className="print-header">
      {data.instituteLogo && <img src={data.instituteLogo} alt="Logo" className="print-logo" />}
      <div className="print-header-text">
        {data.instituteName && <div className="print-institute">{data.instituteName}</div>}
        {data.instituteDepartment && <div className="print-department">{data.instituteDepartment}</div>}
      </div>
    </div>
  );
}

function PrintFooter() {
  return (
    <div className="print-footer">
      <span>TimeTable Incharge</span>
      <span>HOD</span>
    </div>
  );
}

const CRITERIA = [
  { id: "semester", label: "Semester wise" },
  { id: "room", label: "Class room wise" },
  { id: "faculty", label: "Faculty wise" },
  { id: "course", label: "Course wise" },
  { id: "daytime", label: "Day / time wise" },
];

function TimetablePortal() {
  const [data, setData] = useState(EMPTY_DATA);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("search");
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [showAdminLogin, setShowAdminLogin] = useState(false);
  const [modalCtx, setModalCtx] = useState(null);
  const [dragError, setDragError] = useState(null);
  const [builderClassId, setBuilderClassId] = useState("");
  const [classViewId, setClassViewId] = useState("");
  const [techId, setTechId] = useState("");
  const [selectedScholarId, setSelectedScholarId] = useState("");
  const [saveState, setSaveState] = useState("idle");
  const saveTimer = useRef(null);
  const fileInputRef = useRef(null);
  const [genWarnings, setGenWarnings] = useState(null);
  const [reportSaveMsg, setReportSaveMsg] = useState("");

  const [session, setSession] = useState("2026-27");
  const [wef, setWef] = useState("odd");
  const [criteria, setCriteria] = useState("semester");
  const [fDept, setFDept] = useState("");
  const [fProgram, setFProgram] = useState("");
  const [fSemester, setFSemester] = useState("");
  const [fClass, setFClass] = useState("");
  const [fRoom, setFRoom] = useState("");
  const [fFaculty, setFFaculty] = useState("");
  const [fSubject, setFSubject] = useState("");
  const [fDay, setFDay] = useState("");
  const [fPeriod, setFPeriod] = useState("");
  const [viewed, setViewed] = useState(false);
  const [printPayload, setPrintPayload] = useState(null);

  const exportPDF = (payload) => {
    setPrintPayload(payload);
    setTimeout(() => window.print(), 80);
  };

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY);
        if (res?.value) {
          const parsed = withDefaults(JSON.parse(res.value));
          setData(parsed);
          setBuilderClassId(parsed.classes?.[0]?.id || "");
          setClassViewId(parsed.classes?.[0]?.id || "");
        } else {
          const seeded = seedData();
          setData(seeded);
          setBuilderClassId(seeded.classes[0].id);
          setClassViewId(seeded.classes[0].id);
        }
      } catch {
        const seeded = seedData();
        setData(seeded);
        setBuilderClassId(seeded.classes[0].id);
        setClassViewId(seeded.classes[0].id);
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    setSaveState("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await window.storage.set(STORAGE_KEY, JSON.stringify(data));
        setSaveState("saved");
      } catch {
        setSaveState("error");
      }
    }, 500);
    return () => clearTimeout(saveTimer.current);
  }, [data, loaded]);

  const addDept = (name, short) => setData((prev) => ({ ...prev, departments: [...prev.departments, { id: uid(), name, short: (short || name.slice(0, 4)).toUpperCase() }] }));
  const removeDept = (id) => setData((prev) => ({
    ...prev,
    departments: prev.departments.filter((d) => d.id !== id),
    classes: prev.classes.filter((c) => c.departmentId !== id),
    subjects: prev.subjects.filter((s) => s.departmentId !== id),
  }));
  const addClass = (cls) => setData((prev) => {
    const newClass = { id: uid(), batches: [], ...cls };
    // If another class in the same department/program/semester already has a
    // curriculum mapped, carry over what safely applies (whole-class mappings
    // right away; batch-specific ones once matching batches exist) so it
    // doesn't need to be entered again from scratch.
    const candidate = prev.classes.find((c) =>
      c.departmentId === newClass.departmentId && c.program === newClass.program && c.semester === newClass.semester &&
      prev.assignments.some((a) => a.classId === c.id)
    );
    let assignments = prev.assignments;
    if (candidate) {
      const tempData = { ...prev, classes: [...prev.classes, newClass] };
      const copyable = computeCopyableAssignments(tempData, candidate.id, newClass.id);
      if (copyable.length) assignments = [...prev.assignments, ...copyable.map((a) => ({ id: uid(), classId: newClass.id, ...a }))];
    }
    return { ...prev, classes: [...prev.classes, newClass], assignments };
  });
  const copyAssignmentsFromClass = (toClassId, fromClassId) => setData((prev) => {
    const copyable = computeCopyableAssignments(prev, fromClassId, toClassId);
    if (!copyable.length) return prev;
    return { ...prev, assignments: [...prev.assignments, ...copyable.map((a) => ({ id: uid(), classId: toClassId, ...a }))] };
  });
  const removeClass = (id) => setData((prev) => ({
    ...prev,
    classes: prev.classes.filter((c) => c.id !== id),
    entries: prev.entries.filter((e) => e.classId !== id),
    assignments: prev.assignments.filter((a) => a.classId !== id),
  }));
  const addBatch = (classId, name) => setData((prev) => ({
    ...prev,
    classes: prev.classes.map((c) => c.id === classId ? { ...c, batches: [...(c.batches || []), { id: uid(), name }] } : c),
  }));
  const removeBatch = (classId, batchId) => setData((prev) => ({
    ...prev,
    classes: prev.classes.map((c) => c.id === classId ? { ...c, batches: (c.batches || []).filter((b) => b.id !== batchId) } : c),
    // Un-batch any entries that referenced the removed batch instead of orphaning them.
    entries: prev.entries.map((e) => e.batchId === batchId ? { ...e, batchId: null } : e),
  }));
  // patch === null clears the override so the class falls back to the institute default.
  const setClassLunch = (classId, patch) => setData((prev) => ({
    ...prev,
    classes: prev.classes.map((c) => c.id === classId ? { ...c, customLunch: patch } : c),
  }));
  const addSubject = (subj) => setData((prev) => ({ ...prev, subjects: [...prev.subjects, { id: uid(), ...subj }] }));
  const updateSubject = (id, patch) => setData((prev) => ({ ...prev, subjects: prev.subjects.map((s) => (s.id === id ? { ...s, ...patch } : s)) }));
  const removeSubject = (id) => setData((prev) => ({
    ...prev,
    subjects: prev.subjects.filter((s) => s.id !== id),
    entries: prev.entries.filter((e) => e.subjectId !== id),
    assignments: prev.assignments.filter((a) => a.subjectId !== id),
  }));
  const addFaculty = (name, short, designation) => setData((prev) => ({ ...prev, faculty: [...prev.faculty, { id: uid(), name, short: short || "", designation: designation || "" }] }));
  const updateFaculty = (id, patch) => setData((prev) => ({ ...prev, faculty: prev.faculty.map((f) => (f.id === id ? { ...f, ...patch } : f)) }));
  const removeFaculty = (id) => setData((prev) => ({
    ...prev,
    faculty: prev.faculty.filter((f) => f.id !== id),
    entries: prev.entries.filter((e) => e.facultyId !== id),
    assignments: prev.assignments.filter((a) => a.facultyId !== id),
  }));
  const addTechnician = (name, short, designation) => setData((prev) => ({ ...prev, technicians: [...prev.technicians, { id: uid(), name, short: short || "", designation: designation || "" }] }));
  const updateTechnician = (id, patch) => setData((prev) => ({ ...prev, technicians: prev.technicians.map((t) => (t.id === id ? { ...t, ...patch } : t)) }));
  const removeTechnician = (id) => setData((prev) => ({
    ...prev,
    technicians: prev.technicians.filter((t) => t.id !== id),
    rooms: prev.rooms.map((r) => (r.technicianId === id ? { ...r, technicianId: "" } : r)),
    technicianAssignments: (prev.technicianAssignments || []).filter((a) => a.technicianId !== id),
  }));
  const addRoom = (name, type) => setData((prev) => ({ ...prev, rooms: [...prev.rooms, { id: uid(), name, type: type || "classroom" }] }));
  const removeRoom = (id) => setData((prev) => ({ ...prev, rooms: prev.rooms.filter((r) => r.id !== id), entries: prev.entries.filter((e) => e.roomId !== id) }));
  const setRoomTechnician = (roomId, technicianId) => setData((prev) => ({ ...prev, rooms: prev.rooms.map((r) => (r.id === roomId ? { ...r, technicianId } : r)) }));

  const addScholar = (name, short, degree) => setData((prev) => ({ ...prev, scholars: [...prev.scholars, { id: uid(), name, short: short || "", degree: degree || "PhD" }] }));
  const updateScholar = (id, patch) => setData((prev) => ({ ...prev, scholars: prev.scholars.map((s) => (s.id === id ? { ...s, ...patch } : s)) }));
  const removeScholar = (id) => setData((prev) => ({
    ...prev,
    scholars: prev.scholars.filter((s) => s.id !== id),
    scholarAssignments: prev.scholarAssignments.filter((a) => a.scholarId !== id),
  }));
  // A scholar can be assigned to several lab + batch combinations; batch is
  // stored as "" to mean "whole lab, no batch split". Duplicate rows are
  // silently ignored.
  const addScholarAssignment = (scholarId, roomId, batch) => setData((prev) => {
    const normalizedBatch = batch || "";
    if (prev.scholarAssignments.some((a) => a.scholarId === scholarId && a.roomId === roomId && (a.batch || "") === normalizedBatch)) return prev;
    return { ...prev, scholarAssignments: [...prev.scholarAssignments, { id: uid(), scholarId, roomId, batch: normalizedBatch }] };
  });
  const removeScholarAssignment = (id) => setData((prev) => ({ ...prev, scholarAssignments: prev.scholarAssignments.filter((a) => a.id !== id) }));

  // A technician can be assigned to several lab + batch combinations, and
  // more than one technician can share the same lab/batch combo (many-to-many,
  // same pattern as scholars). Batch "" means "whole lab, no batch split".
  const addTechnicianAssignment = (technicianId, roomId, batch) => setData((prev) => {
    const normalizedBatch = batch || "";
    if ((prev.technicianAssignments || []).some((a) => a.technicianId === technicianId && a.roomId === roomId && (a.batch || "") === normalizedBatch)) return prev;
    return { ...prev, technicianAssignments: [...(prev.technicianAssignments || []), { id: uid(), technicianId, roomId, batch: normalizedBatch }] };
  });
  const removeTechnicianAssignment = (id) => setData((prev) => ({ ...prev, technicianAssignments: (prev.technicianAssignments || []).filter((a) => a.id !== id) }));
  // Clears all technicians, their lab/batch assignments, the per-room
  // default in-charge, and any per-entry technician pick — but leaves
  // everything else (classes, faculty, scholars, entries themselves, etc.)
  // untouched.
  const resetTechnicianData = () => setData((prev) => ({
    ...prev,
    technicians: [],
    technicianAssignments: [],
    rooms: prev.rooms.map((r) => ({ ...r, technicianId: "" })),
    entries: prev.entries.map((e) => ({ ...e, technicianId: null })),
  }));
  // Clears just ONE technician's lab/batch assignments (their timetable),
  // including their default in-charge slot on any room and any per-entry
  // pick — but leaves the technician record itself and everyone else's
  // assignments/entries untouched.
  const resetOneTechnicianTimetable = (technicianId) => setData((prev) => ({
    ...prev,
    technicianAssignments: (prev.technicianAssignments || []).filter((a) => a.technicianId !== technicianId),
    rooms: prev.rooms.map((r) => (r.technicianId === technicianId ? { ...r, technicianId: "" } : r)),
    entries: prev.entries.map((e) => (e.technicianId === technicianId ? { ...e, technicianId: null } : e)),
  }));
  // Clears just ONE scholar's lab/batch assignments (their timetable) —
  // leaves the scholar record itself and everyone else's data untouched.
  const resetOneScholarTimetable = (scholarId) => setData((prev) => ({
    ...prev,
    scholarAssignments: prev.scholarAssignments.filter((a) => a.scholarId !== scholarId),
  }));

  const exportBackup = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${sanitizeFilename("timetable-backup-" + session)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  const importBackup = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = withDefaults(JSON.parse(reader.result));
        setData(parsed);
        setBuilderClassId(parsed.classes?.[0]?.id || "");
        setClassViewId(parsed.classes?.[0]?.id || "");
      } catch {
        alert("That file doesn't look like a valid backup.");
      }
    };
    reader.readAsText(file);
  };

  const addAssignment = (classId, a) => setData((prev) => ({ ...prev, assignments: [...prev.assignments, { id: uid(), classId, ...a }] }));
  const removeAssignment = (id) => setData((prev) => ({ ...prev, assignments: prev.assignments.filter((a) => a.id !== id) }));

  const setPeriodsCount = (n) => setData((prev) => ({
    ...prev,
    periodsCount: Math.max(4, Math.min(10, n || 7)),
    lunchAfter: Math.min(prev.lunchAfter ?? 4, Math.max(1, Math.max(4, Math.min(10, n || 7)) - 1)),
  }));
  const setDaysPerWeek = (n) => setData((prev) => {
    const nextDays = Math.max(1, Math.min(7, n || DEFAULT_DAYS_PER_WEEK));
    const allowed = new Set(ALL_DAY_NAMES.slice(0, nextDays));
    return {
      ...prev,
      daysPerWeek: nextDays,
      // Drop any scheduled sessions that fall on a day no longer in the active week.
      entries: prev.entries.filter((e) => allowed.has(e.day)),
    };
  });
  const setStartMinutes = (mins) => setData((prev) => ({ ...prev, startMinutes: mins }));
  const setSlotMinutes = (mins) => setData((prev) => ({ ...prev, slotMinutes: Math.max(15, Math.min(180, mins || DEFAULT_SLOT_MINUTES)) }));
  const setGapMinutes = (mins) => setData((prev) => ({ ...prev, gapMinutes: Math.max(0, Math.min(60, mins || 0)) }));
  const setLunchEnabled = (on) => setData((prev) => ({ ...prev, lunchEnabled: on }));
  const setLunchAfter = (n) => setData((prev) => ({ ...prev, lunchAfter: Math.max(1, Math.min(prev.periodsCount - 1, n || 1)) }));
  const setLunchMinutes = (mins) => setData((prev) => ({ ...prev, lunchMinutes: Math.max(10, Math.min(120, mins || DEFAULT_LUNCH_MINUTES)) }));

  const saveEntry = (entryOrEntries) => {
    setData((prev) => {
      if (Array.isArray(entryOrEntries)) {
        return { ...prev, entries: [...prev.entries, ...entryOrEntries] };
      }
      const exists = prev.entries.some((e) => e.id === entryOrEntries.id);
      const entries = exists ? prev.entries.map((e) => (e.id === entryOrEntries.id ? entryOrEntries : e)) : [...prev.entries, entryOrEntries];
      return { ...prev, entries };
    });
    setModalCtx(null);
  };
  const deleteEntry = (id) => {
    setData((prev) => ({ ...prev, entries: prev.entries.filter((e) => e.id !== id) }));
    setModalCtx(null);
  };
  const toggleFreeze = (id) => {
    setData((prev) => ({ ...prev, entries: prev.entries.map((e) => (e.id === id ? { ...e, frozen: !e.frozen } : e)) }));
  };

  // Drag-and-drop moving of one or more entries (a merged batch group moves
  // together) onto a different day/period. Validates fit, class occupancy,
  // and faculty/room conflicts against everything else before committing.
  const dragErrorTimer = useRef(null);
  const flashDragError = (msg) => {
    setDragError(msg);
    clearTimeout(dragErrorTimer.current);
    dragErrorTimer.current = setTimeout(() => setDragError(null), 3500);
  };
  const moveEntries = (ids, day, period) => {
    const moving = data.entries.filter((e) => ids.includes(e.id));
    if (moving.length === 0) return;
    if (moving.every((m) => m.day === day && m.period === period)) return; // dropped back in place
    if (moving.some((m) => m.frozen)) { flashDragError("Unfreeze this slot before moving it."); return; }
    const maxSpan = Math.max(...moving.map((m) => m.span));
    if (period < 0 || period + maxSpan > data.periodsCount) { flashDragError("That doesn't fit in the day at this position."); return; }
    const others = data.entries.filter((e) => !ids.includes(e.id));
    const classId = moving[0].classId;
    const classClash = others.some((e) => e.classId === classId && e.day === day && moving.some((m) => overlaps(e.period, e.span, period, m.span)));
    if (classClash) { flashDragError("This class already has a session at that time."); return; }
    for (const m of moving) {
      const facultyBusy = others.some((e) => e.day === day && e.facultyId === m.facultyId && overlaps(e.period, e.span, period, m.span));
      if (facultyBusy) { flashDragError(`${data.faculty.find((f) => f.id === m.facultyId)?.name || "That faculty member"} is already booked then.`); return; }
      const roomBusy = others.some((e) => e.day === day && e.roomId === m.roomId && overlaps(e.period, e.span, period, m.span));
      if (roomBusy) { flashDragError("That room is already booked then."); return; }
    }
    setData((prev) => ({ ...prev, entries: prev.entries.map((e) => (ids.includes(e.id) ? { ...e, day, period } : e)) }));
  };

  const runAutoGenerate = () => {
    if (!builderClassId) return;
    const { entries: classEntries, skipped } = generateTentativeTimetable(builderClassId, data);
    setData((prev) => ({ ...prev, entries: [...prev.entries.filter((e) => e.classId !== builderClassId), ...classEntries] }));
    setGenWarnings(skipped);
  };

  const builderEntries = useMemo(() => data.entries.filter((e) => e.classId === builderClassId), [data.entries, builderClassId]);
  const builderClass = useMemo(() => data.classes.find((c) => c.id === builderClassId), [data.classes, builderClassId]);
  const builderAssignments = useMemo(() => data.assignments.filter((a) => a.classId === builderClassId), [data.assignments, builderClassId]);
  const builderNonMapping = useMemo(
    () => builderAssignments
      .map((a) => ({ assignment: a, subject: data.subjects.find((s) => s.id === a.subjectId), faculty: data.faculty.find((f) => f.id === a.facultyId) }))
      .filter((row) => isNonMappingType(row.subject?.classType)),
    [builderAssignments, data.subjects, data.faculty]
  );

  const classViewEntries = useMemo(() => data.entries.filter((e) => e.classId === classViewId), [data.entries, classViewId]);
  const classViewClass = useMemo(() => data.classes.find((c) => c.id === classViewId), [data.classes, classViewId]);
  const classViewAssignments = useMemo(() => data.assignments.filter((a) => a.classId === classViewId), [data.assignments, classViewId]);
  const classViewNonMapping = useMemo(
    () => classViewAssignments
      .map((a) => ({ assignment: a, subject: data.subjects.find((s) => s.id === a.subjectId), faculty: data.faculty.find((f) => f.id === a.facultyId) }))
      .filter((row) => isNonMappingType(row.subject?.classType)),
    [classViewAssignments, data.subjects, data.faculty]
  );

  // Technician / technical staff view: pick a technician and show every lab
  // session that's theirs. Merges two sources, same as the Scholar tab —
  // (1) explicit lab + batch assignments (Setup > Lab / Batch ↔ technician
  // assignment), which support many-to-many (one technician across several
  // labs/batches, and several technicians sharing one lab/batch); plus
  // (2) the legacy per-entry pick or per-lab default in-charge (Setup > Lab
  // ↔ technician assignment) for backward compatibility. Never
  // theory/tutorial/seminar, even if one was ever placed in a lab room.
  const technicianAssignmentsForSelected = useMemo(
    () => (data.technicianAssignments || []).filter((a) => a.technicianId === techId),
    [data.technicianAssignments, techId]
  );
  const techEntries = useMemo(() => {
    if (!techId) return [];
    const keys = new Set(technicianAssignmentsForSelected.map((a) => `${a.roomId}::${a.batch || ""}`));
    return data.entries.filter((e) => {
      if (data.subjects.find((s) => s.id === e.subjectId)?.classType !== "lab") return false;
      if (keys.has(`${e.roomId}::${batchLabel(e, data)}`)) return true;
      if (e.technicianId) return e.technicianId === techId;
      const room = data.rooms.find((r) => r.id === e.roomId);
      return room?.technicianId === techId;
    });
  }, [data.entries, data.subjects, data.classes, data.rooms, techId, technicianAssignmentsForSelected]);
  // Labs to display as "in charge of": default-assigned labs, plus any lab
  // that currently has at least one session explicitly handed to this
  // technician even though it isn't their default lab.
  const techAssignedLabs = useMemo(() => {
    const roomIds = new Set(techEntries.map((e) => e.roomId));
    return data.rooms.filter((r) => r.type === "lab" && (r.technicianId === techId || roomIds.has(r.id)));
  }, [data.rooms, techId, techEntries]);
  const technicianAssignmentSummary = useMemo(
    () => technicianAssignmentsForSelected
      .map((a) => `${data.rooms.find((r) => r.id === a.roomId)?.name || "?"}${a.batch ? ` (${a.batch})` : " (whole lab)"}`)
      .join(", "),
    [technicianAssignmentsForSelected, data.rooms]
  );

  // Scholar (research scholar / lab demonstrator) view: a scholar can be
  // assigned to several lab + batch combinations in Setup (data.scholarAssignments).
  // Batches are matched by name (e.g. "B1") rather than id, since the same
  // batch label can recur across different classes sharing a lab. An
  // assignment with an empty batch means "whole lab, no batch split".
  const scholarAssignmentsForSelected = useMemo(
    () => data.scholarAssignments.filter((a) => a.scholarId === selectedScholarId),
    [data.scholarAssignments, selectedScholarId]
  );
  const scholarEntries = useMemo(() => {
    if (scholarAssignmentsForSelected.length === 0) return [];
    const keys = new Set(scholarAssignmentsForSelected.map((a) => `${a.roomId}::${a.batch || ""}`));
    return data.entries.filter((e) => {
      if (data.subjects.find((s) => s.id === e.subjectId)?.classType !== "lab") return false;
      return keys.has(`${e.roomId}::${batchLabel(e, data)}`);
    });
  }, [data.entries, data.subjects, data.classes, scholarAssignmentsForSelected]);
  const scholarAssignmentSummary = useMemo(
    () => scholarAssignmentsForSelected
      .map((a) => `${data.rooms.find((r) => r.id === a.roomId)?.name || "?"}${a.batch ? ` (${a.batch})` : " (whole lab)"}`)
      .join(", "),
    [scholarAssignmentsForSelected, data.rooms]
  );

  const semesterOptions = useMemo(() => {
    const set = new Set(data.classes.filter((c) => (!fDept || c.departmentId === fDept) && (!fProgram || c.program === fProgram)).map((c) => c.semester));
    return SEMESTERS.filter((s) => set.has(s));
  }, [data.classes, fDept, fProgram]);

  const matchingClasses = useMemo(
    () => data.classes.filter((c) => (!fDept || c.departmentId === fDept) && (!fProgram || c.program === fProgram) && (!fSemester || c.semester === fSemester)),
    [data.classes, fDept, fProgram, fSemester]
  );

  const requirementsMet = useMemo(() => {
    if (criteria === "semester") return fDept && fProgram && fSemester && fClass;
    if (criteria === "room") return !!fRoom;
    if (criteria === "faculty") return !!fFaculty;
    if (criteria === "course") return fDept && fSubject;
    if (criteria === "daytime") return fDay && fPeriod !== "";
    return false;
  }, [criteria, fDept, fProgram, fSemester, fClass, fRoom, fFaculty, fSubject, fDay, fPeriod]);

  const runView = () => setViewed(true);

  const searchResult = useMemo(() => {
    if (!requirementsMet) return null;
    const sch = getSchedule(data);
    if (criteria === "semester") {
      const cls = data.classes.find((c) => c.id === fClass);
      return { title: `${className(cls, data.departments)} Timetable`, subtitleLabel: `Class: ${className(cls, data.departments)}`, type: "grid", mode: "class", classId: fClass, showLabStaff: true, periodsCount: data.periodsCount, entries: data.entries.filter((e) => e.classId === fClass) };
    }
    if (criteria === "room") {
      const room = data.rooms.find((r) => r.id === fRoom);
      return { title: `${room?.name || "Room"} Timetable`, subtitleLabel: `Room: ${room?.name || "—"}`, type: "grid", mode: "room", showFaculty: true, showLabStaff: true, periodsCount: data.periodsCount, entries: data.entries.filter((e) => e.roomId === fRoom) };
    }
    if (criteria === "faculty") {
      const fac = data.faculty.find((f) => f.id === fFaculty);
      return { title: `${fac?.name || "Faculty"} Timetable`, subtitleLabel: `Faculty/Class Name: ${fac?.name || "—"}`, type: "grid", mode: "faculty", showLabStaff: true, periodsCount: data.periodsCount, entries: data.entries.filter((e) => e.facultyId === fFaculty) };
    }
    if (criteria === "course") {
      const subject = data.subjects.find((s) => s.id === fSubject);
      const columns = [{ key: "day", label: "Day" }, { key: "time", label: "Time" }, { key: "class", label: "Class" }, { key: "faculty", label: "Faculty" }, { key: "room", label: "Room" }];
      const rows = data.entries.filter((e) => e.subjectId === fSubject).map((e) => ({
        day: e.day,
        time: periodLabel(e.period, sch),
        class: className(data.classes.find((c) => c.id === e.classId), data.departments),
        faculty: data.faculty.find((f) => f.id === e.facultyId)?.name || "—",
        room: data.rooms.find((r) => r.id === e.roomId)?.name || "—",
      }));
      return { title: `${subject?.code || ""} ${subject?.name || "Course"} Schedule`, type: "table", columns, rows };
    }
    if (criteria === "daytime") {
      const columns = [{ key: "class", label: "Class" }, { key: "subject", label: "Subject" }, { key: "type", label: "Type" }, { key: "faculty", label: "Faculty" }, { key: "room", label: "Room" }];
      const rows = data.entries
        .filter((e) => e.day === fDay && overlaps(e.period, e.span, Number(fPeriod), 1))
        .map((e) => {
          const subj = data.subjects.find((s) => s.id === e.subjectId);
          return {
            class: className(data.classes.find((c) => c.id === e.classId), data.departments),
            subject: subj?.name || "—",
            type: typeLabel(subj?.classType),
            faculty: data.faculty.find((f) => f.id === e.facultyId)?.name || "—",
            room: data.rooms.find((r) => r.id === e.roomId)?.name || "—",
          };
        });
      return { title: `${fDay} · Period ${Number(fPeriod) + 1} Snapshot`, type: "table", columns, rows };
    }
    return null;
  }, [criteria, requirementsMet, fClass, fRoom, fFaculty, fSubject, fDay, fPeriod, data]);

  useEffect(() => setViewed(false), [criteria, fDept, fProgram, fSemester, fClass, fRoom, fFaculty, fSubject, fDay, fPeriod]);
  useEffect(() => setGenWarnings(null), [builderClassId]);

  const resetFilters = () => {
    setFDept(""); setFProgram(""); setFSemester(""); setFClass("");
    setFRoom(""); setFFaculty(""); setFSubject(""); setFDay(""); setFPeriod("");
    setViewed(false);
  };

  const facultyLoad = useMemo(() => computeFacultyLoad(data), [data]);
  const deptLoad = useMemo(() => computeDepartmentLoad(data), [data]);
  const grandTotalPeriods = facultyLoad.reduce((s, f) => s + f.periods, 0);
  const grandTotalHours = Math.round(facultyLoad.reduce((s, f) => s + f.hours, 0) * 10) / 10;

  const saveReportSnapshot = () => {
    const snapshot = {
      id: uid(),
      title: `Load report · ${session}`,
      session,
      generatedAt: new Date().toISOString(),
      facultyRows: facultyLoad,
      deptRows: deptLoad,
    };
    setData((prev) => ({ ...prev, savedReports: [snapshot, ...prev.savedReports] }));
    setReportSaveMsg("Snapshot saved.");
    setTimeout(() => setReportSaveMsg(""), 2500);
  };
  const deleteReportSnapshot = (id) => setData((prev) => ({ ...prev, savedReports: prev.savedReports.filter((r) => r.id !== id) }));

  const tabs = [
    { id: "search", label: "Search timetable", icon: Search },
    { id: "classview", label: "Class-wise timetable", icon: GraduationCap },
    { id: "technician", label: "Technician timetable", icon: Wrench },
    { id: "scholar", label: "Scholar timetable", icon: FlaskConical },
    { id: "builder", label: "Build timetable", icon: CalendarRange },
    { id: "load", label: "Faculty load", icon: BarChart3 },
    { id: "setup", label: "Setup", icon: Settings2 },
  ];
  const isAdmin = !data.adminPassword || adminUnlocked;
  const visibleTabs = tabs.filter((t) => !PROTECTED_TABS.includes(t.id) || isAdmin);
  useEffect(() => {
    if (PROTECTED_TABS.includes(tab) && !isAdmin) setTab("search");
  }, [tab, isAdmin]);

  if (!loaded) return <div className="p-8 text-sm text-slate-400">Loading timetable data…</div>;

  const sch = getSchedule(data);
  const days = getDays(data);

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800">
      <style>{`
        #print-area { position: fixed; top: -10000px; left: -10000px; width: 1000px; }
        #print-area .print-header { display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center; margin-bottom: 6px; }
        #print-area .print-logo { width: 44px; height: 44px; object-fit: contain; }
        #print-area .print-institute { font-size: 16px; font-weight: 700; }
        #print-area .print-department { font-size: 13px; font-weight: 600; }
        #print-area .print-title { font-size: 15px; font-weight: 600; margin: 4px 0 2px; text-align: center; }
        #print-area .print-meta, #print-area .print-meta-line { font-size: 11px; color: #444; margin: 2px 0 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        #print-area table.print-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 10.5px; }
        #print-area table.print-table th, #print-area table.print-table td { border: 1px solid #333; padding: 4px 5px; vertical-align: top; text-align: left; }
        #print-area table.print-grid th { text-align: center; background: #f1f1f1; }
        #print-area table.print-grid td:first-child, #print-area table.print-grid th:first-child { font-weight: 600; background: #f8f8f8; text-align: center; white-space: nowrap; }
        #print-area .print-time { font-weight: 400; font-size: 9px; color: #555; }
        #print-area .print-lunch-cell { text-align: center; font-style: italic; color: #555; }
        #print-area .print-cell-entry { margin-bottom: 3px; }
        #print-area .print-cell-abbr { font-weight: 700; }
        #print-area .print-cell-room, #print-area .print-cell-class { font-size: 9.5px; color: #333; }
        #print-area .print-cell-batch { font-weight: 700; }
        #print-area .print-cell-tech { color: #6d28d9; }
        #print-area .print-cell-scholar { color: #be185d; }
        #print-area .print-cell-scholar-phd { color: #be185d; }
        #print-area .print-cell-scholar-mtech { color: #b45309; }
        #print-area .print-summary-title { font-weight: 600; font-size: 12px; margin: 4px 0 4px; }
        #print-area .print-empty { text-align: center; font-style: italic; color: #777; }
        #print-area .print-footer { display: flex; justify-content: space-between; margin-top: 40px; font-size: 12px; font-weight: 600; padding: 0 30px; }
        @page { size: landscape; margin: 12mm; }
        @media print {
          body * { visibility: hidden; }
          #print-area, #print-area * { visibility: visible; }
          #print-area { position: absolute; top: 0; left: 0; width: 100%; padding: 0; }
        }
      `}</style>
      {printPayload && (
        <div id="print-area">
          <PrintableTimetable payload={printPayload} data={data} session={session} wef={wef} />
        </div>
      )}
      <div className="bg-slate-900 text-white">
        <div className="max-w-6xl mx-auto px-4 py-4 flex items-center gap-3">
          <Library className="w-6 h-6 text-teal-400" />
          <div>
            <h1 className="text-base font-semibold">Academic Time-Table</h1>
            <p className="text-xs text-slate-400">Institute schedule lookup & management</p>
          </div>
          <span className="ml-auto text-xs text-slate-400 flex items-center gap-1">
            <Save className="w-3.5 h-3.5" />
            {saveState === "saving" ? "Saving…" : saveState === "error" ? "Save failed" : "Saved"}
          </span>
          {data.adminPassword && (
            isAdmin ? (
              <button onClick={() => setAdminUnlocked(false)} className="text-xs flex items-center gap-1 border border-slate-700 rounded-lg px-2 py-1 text-teal-400 hover:bg-slate-800">
                <Check className="w-3.5 h-3.5" /> Admin · Log out
              </button>
            ) : (
              <button onClick={() => setShowAdminLogin(true)} className="text-xs flex items-center gap-1 border border-slate-700 rounded-lg px-2 py-1 text-slate-300 hover:bg-slate-800">
                <Lock className="w-3.5 h-3.5" /> Admin login
              </button>
            )
          )}
        </div>
      </div>

      <div className="max-w-6xl mx-auto px-4 py-6">
        <div className="flex gap-1 mb-6 bg-white border border-slate-200 rounded-xl p-1 w-fit flex-wrap">
          {visibleTabs.map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium ${tab === t.id ? "bg-teal-600 text-white" : "text-slate-500 hover:bg-slate-100"}`}>
              <t.icon className="w-4 h-4" /> {t.label}
            </button>
          ))}
        </div>

        {tab === "search" && (
          <div>
            <div className="bg-white border border-slate-200 rounded-xl p-4 mb-6">
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                <FieldSelect label="Criteria" value={criteria} onChange={setCriteria} options={CRITERIA.map((c) => ({ value: c.id, label: c.label }))} />
                <FieldSelect label="Academic session" value={session} onChange={setSession} options={["2026-27"].map((s) => ({ value: s, label: s }))} />
                <FieldSelect label="W.E.F." value={wef} onChange={setWef} options={[{ value: "odd", label: "Odd semester" }, { value: "even", label: "Even semester" }]} />
                <div />
              </div>

              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                {criteria === "semester" && (
                  <>
                    <FieldSelect label="Department" value={fDept} onChange={(v) => { setFDept(v); setFSemester(""); setFClass(""); }} options={data.departments.map((d) => ({ value: d.id, label: d.short }))} />
                    <FieldSelect label="Program" value={fProgram} onChange={(v) => { setFProgram(v); setFSemester(""); setFClass(""); }} options={[{ value: "UG", label: "UG" }, { value: "PG", label: "PG" }]} />
                    <FieldSelect label="Semester" value={fSemester} onChange={(v) => { setFSemester(v); setFClass(""); }} options={semesterOptions.map((s) => ({ value: s, label: "Sem " + s }))} />
                    <FieldSelect label="Section" value={fClass} onChange={setFClass} options={matchingClasses.map((c) => ({ value: c.id, label: c.section ? "Section " + c.section : "Default" }))} />
                  </>
                )}
                {criteria === "room" && (
                  <FieldSelect label="Class room" value={fRoom} onChange={setFRoom} options={data.rooms.map((r) => ({ value: r.id, label: `${r.name} (${r.type})` }))} />
                )}
                {criteria === "faculty" && (
                  <FieldSelect label="Faculty" value={fFaculty} onChange={setFFaculty} options={data.faculty.map((f) => ({ value: f.id, label: f.name }))} />
                )}
                {criteria === "course" && (
                  <>
                    <FieldSelect label="Department" value={fDept} onChange={(v) => { setFDept(v); setFSubject(""); }} options={data.departments.map((d) => ({ value: d.id, label: d.short }))} />
                    <FieldSelect label="Course" value={fSubject} onChange={setFSubject} options={data.subjects.filter((s) => !fDept || s.departmentId === fDept).map((s) => ({ value: s.id, label: `${s.code} - ${s.name}` }))} />
                  </>
                )}
                {criteria === "daytime" && (
                  <>
                    <FieldSelect label="Day" value={fDay} onChange={setFDay} options={days.map((d) => ({ value: d, label: d }))} />
                    <FieldSelect label="Period" value={fPeriod} onChange={setFPeriod} options={Array.from({ length: data.periodsCount }).map((_, i) => ({ value: String(i), label: `P${i + 1} · ${periodLabel(i, sch)}` }))} />
                  </>
                )}
              </div>

              <div className="flex items-center gap-2 mt-4">
                <button
                  disabled={!requirementsMet}
                  onClick={runView}
                  className={`text-sm px-4 py-1.5 rounded-lg text-white flex items-center gap-1 ${requirementsMet ? "bg-teal-600 hover:bg-teal-700" : "bg-slate-300 cursor-not-allowed"}`}
                >
                  <Search className="w-4 h-4" /> View time-table
                </button>
                {isAdmin && <button onClick={resetFilters} className="text-sm px-3 py-1.5 rounded-lg border border-slate-300 text-slate-600">Reset</button>}
                {!requirementsMet && (
                  <span className="text-xs text-amber-600 flex items-center gap-1"><Info className="w-3.5 h-3.5" /> Please select a valid option to continue.</span>
                )}
              </div>
            </div>

            {viewed && requirementsMet && searchResult && (
              <div>
                <ExportBar
                  onExcel={() => exportExcel(searchResult.title, searchResult, data)}
                  onPdf={() => exportPDF(searchResult)}
                />
                {searchResult.type === "grid" ? (
                  <TimetableGrid periodsCount={searchResult.periodsCount} entries={searchResult.entries} data={data} editable={false} classId={searchResult.classId} />
                ) : (
                  <OccurrenceTable columns={searchResult.columns} rows={searchResult.rows} />
                )}
              </div>
            )}
          </div>
        )}

        {tab === "classview" && (
          <div>
            <div className="flex flex-wrap items-center gap-3 mb-4">
              <label className="text-sm text-slate-500">Class</label>
              <select value={classViewId} onChange={(e) => setClassViewId(e.target.value)} className="text-sm border border-slate-300 rounded-lg px-3 py-1.5">
                {data.classes.length === 0 && <option value="">Add a class in Setup first</option>}
                {data.classes.map((c) => <option key={c.id} value={c.id}>{className(c, data.departments)}</option>)}
              </select>
              <div className="flex flex-wrap items-center gap-3 ml-auto text-xs text-slate-500">
                {SUBJECT_TYPES.map((t) => (
                  <span key={t.id} className="flex items-center gap-1">
                    <span className={`w-3 h-3 rounded border inline-block ${typeStyle(t.id).swatch}`} /> {t.label}
                  </span>
                ))}
              </div>
            </div>

            {classViewId ? (
              <>
                <ExportBar
                  onExcel={() => exportExcel(`${className(classViewClass, data.departments)} Timetable`, { type: "grid", periodsCount: data.periodsCount, entries: classViewEntries, classId: classViewId }, data)}
                  onPdf={() => exportPDF({ title: `${className(classViewClass, data.departments)} Timetable`, subtitleLabel: `Class: ${className(classViewClass, data.departments)}`, type: "grid", mode: "class", classId: classViewId, showLabStaff: true, periodsCount: data.periodsCount, entries: classViewEntries })}
                />
                {classViewEntries.length === 0 ? (
                  <p className="text-sm text-slate-400 italic mb-3">No periods scheduled yet for this class — build one in the "Build timetable" tab.</p>
                ) : null}
                <TimetableGrid periodsCount={data.periodsCount} entries={classViewEntries} data={data} editable={false} classId={classViewId} />
                {classViewNonMapping.length > 0 && (
                  <div className="mt-4 border border-slate-200 rounded-lg p-3">
                    <p className="text-xs font-semibold text-slate-600 mb-2">Non-time-tabled subjects</p>
                    <div className="space-y-1">
                      {classViewNonMapping.map((row) => (
                        <div key={row.assignment.id} className="flex items-center justify-between text-sm">
                          <span className="text-slate-700">
                            {row.subject?.name}
                            <span className={`ml-2 text-xs px-1.5 py-0.5 rounded ${typeStyle(row.subject?.classType).chip}`}>{typeLabel(row.subject?.classType)}</span>
                          </span>
                          <span className="text-slate-400 text-xs">Supervisor: {row.faculty?.name || "—"}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </>
            ) : (
              <p className="text-sm text-slate-400">Create at least one class in Setup to view a class-wise timetable.</p>
            )}
          </div>
        )}

        {tab === "technician" && (
          <div>
            <div className="flex flex-wrap items-center gap-3 mb-4">
              <label className="text-sm text-slate-500">Technician</label>
              <select value={techId} onChange={(e) => setTechId(e.target.value)} className="text-sm border border-slate-300 rounded-lg px-3 py-1.5">
                <option value="">{data.technicians.length === 0 ? "Add a technician in Setup first" : "Select a technician…"}</option>
                {data.technicians.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
              </select>
              <span className="text-xs text-slate-400">Shows every lab + batch combination assigned to the technician in Setup, merged into one timetable (multiple technicians can share a lab/batch).</span>
              {techId && isAdmin && (
                <button
                  onClick={() => { if (window.confirm(`Delete ${data.technicians.find((t) => t.id === techId)?.name || "this technician"}'s lab/batch timetable assignments? This can't be undone.`)) resetOneTechnicianTimetable(techId); }}
                  className="text-sm px-3 py-1.5 rounded-lg border border-slate-300 text-slate-600 ml-auto flex items-center gap-1"
                >
                  <Trash2 className="w-3.5 h-3.5" /> Reset timetable
                </button>
              )}
            </div>

            {techId ? (
              techAssignedLabs.length === 0 ? (
                <p className="text-sm text-slate-400 italic">No labs/batches assigned to this technician yet. Assign them in Setup → "Lab / Batch ↔ technician assignment".</p>
              ) : (
                <>
                  <p className="text-xs text-slate-500 mb-3">
                    In charge of: {techAssignedLabs.map((r) => r.name).join(", ")}
                    {technicianAssignmentSummary && ` · Assigned: ${technicianAssignmentSummary}`}
                  </p>
                  <ExportBar
                    onExcel={() => exportExcel(`${data.technicians.find((t) => t.id === techId)?.name || "Technician"} Timetable`, { type: "grid", periodsCount: data.periodsCount, entries: techEntries }, data)}
                    onPdf={() => exportPDF({ title: `${data.technicians.find((t) => t.id === techId)?.name || "Technician"} Timetable`, subtitleLabel: `Technician: ${data.technicians.find((t) => t.id === techId)?.name || "—"}`, type: "grid", mode: "room", showFaculty: true, showLabStaff: true, excludeTechnicianId: techId, periodsCount: data.periodsCount, entries: techEntries })}
                  />

              </Section>
            )}
            <ScholarAssignmentManager data={data} onAdd={addScholarAssignment} onRemove={removeScholarAssignment} />
            <SubjectManager departments={data.departments} subjects={data.subjects} onAdd={addSubject} onUpdate={updateSubject} onRemove={removeSubject} />

            <Section icon={Lock} title="Security — admin password">
              <p className="text-xs text-slate-500 mb-3">
                {data.adminPassword
                  ? "Build timetable, Faculty load, and Setup are locked behind this password for the rest of the browser session (re-enter after a page reload)."
                  : "Set a password to lock Build timetable, Faculty load, and Setup. Leave blank and everyone can use those tabs freely."}
              </p>
              <AdminPasswordForm
                hasPassword={!!data.adminPassword}
                onSet={(pw) => { setData((prev) => ({ ...prev, adminPassword: pw })); setAdminUnlocked(!!pw); }}
              />
            </Section>
            <Section icon={Download} title="Backup & restore">
              <p className="text-xs text-slate-500 mb-3">All data lives only in this browser's storage. Download a backup to move it to another computer or browser, or restore one here.</p>
              <div className="flex gap-2">
                <button onClick={exportBackup} className="flex-1 text-sm px-3 py-1.5 rounded-lg border border-slate-300 text-slate-600 flex items-center justify-center gap-1.5 hover:bg-slate-50 bg-white">
                  <Download className="w-4 h-4 text-teal-600" /> Download backup
                </button>
                <button onClick={() => fileInputRef.current?.click()} className="flex-1 text-sm px-3 py-1.5 rounded-lg border border-slate-300 text-slate-600 flex items-center justify-center gap-1.5 hover:bg-slate-50 bg-white">
                  <Upload className="w-4 h-4 text-teal-600" /> Restore backup
                </button>
                <input ref={fileInputRef} type="file" accept="application/json" className="hidden" onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) importBackup(f); e.target.value = ""; }} />
              </div>
            </Section>

            <Section icon={Clock} title="Period timing">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-medium text-slate-500 block mb-1">Number of days in the week</label>
                  <select
                    value={data.daysPerWeek}
                    onChange={(e) => setDaysPerWeek(Number(e.target.value))}
                    className="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm bg-white"
                  >
                    {[1, 2, 3, 4, 5, 6, 7].map((n) => (
                      <option key={n} value={n}>{n} day{n > 1 ? "s" : ""} ({ALL_DAY_NAMES.slice(0, n).join(", ")})</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 block mb-1">Periods per day</label>
                  <input
                    type="number" min={4} max={10} value={data.periodsCount}
                    onChange={(e) => setPeriodsCount(Number(e.target.value))}
                    className="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm"
                  />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 block mb-1">Period length (minutes)</label>
                  <input
                    type="number" min={15} max={180} step={5} value={data.slotMinutes}
                    onChange={(e) => setSlotMinutes(Number(e.target.value))}
                    className="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm"
                  />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 block mb-1">Gap between periods (minutes)</label>
                  <input
                    type="number" min={0} max={60} step={5} value={data.gapMinutes ?? 0}
                    onChange={(e) => setGapMinutes(Number(e.target.value))}
                    className="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm"
                  />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 block mb-1">First period starts at</label>
                  <input
                    type="time" value={minutesToTimeInputValue(data.startMinutes)}
                    onChange={(e) => setStartMinutes(timeInputValueToMinutes(e.target.value))}
                    className="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm"
                  />
                </div>
              </div>
              <div className="mt-3 text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
                Preview: P1 starts at <span className="font-medium text-slate-700">{formatTime(periodStartMinutes(0, sch))}</span>, last period (P{data.periodsCount}) ends at{" "}
                <span className="font-medium text-slate-700">{formatTime(periodStartMinutes(data.periodsCount - 1, sch) + data.slotMinutes)}</span>.
              </div>

              <div className="mt-4 pt-4 border-t border-slate-200">
                <label className="flex items-center gap-2 text-xs font-medium text-slate-600 mb-3">
                  <input type="checkbox" checked={!!data.lunchEnabled} onChange={(e) => setLunchEnabled(e.target.checked)} className="rounded border-slate-300" />
                  Define a lunch break
                </label>
                {data.lunchEnabled && (
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-medium text-slate-500 block mb-1">Lunch after period</label>
                      <select
                        value={data.lunchAfter ?? 4}
                        onChange={(e) => setLunchAfter(Number(e.target.value))}
                        className="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm bg-white"
                      >
                        {Array.from({ length: Math.max(1, data.periodsCount - 1) }).map((_, i) => (
                          <option key={i} value={i + 1}>After P{i + 1}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-medium text-slate-500 block mb-1">Lunch duration (minutes)</label>
                      <input
                        type="number" min={10} max={120} step={5} value={data.lunchMinutes ?? DEFAULT_LUNCH_MINUTES}
                        onChange={(e) => setLunchMinutes(Number(e.target.value))}
                        className="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm"
                      />
                    </div>
                    <div className="col-span-2 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
                      Lunch break: <span className="font-medium">{lunchTimeLabel(sch)}</span>, shown as a break row in every timetable view and export.
                    </div>
                  </div>
                )}
              </div>
            </Section>
          </div>
          )
        )}
      </div>

      {modalCtx && <CellModal context={modalCtx} data={data} onClose={() => setModalCtx(null)} onSave={saveEntry} onDelete={deleteEntry} />}
      {showAdminLogin && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 px-4" onClick={() => setShowAdminLogin(false)}>
          <div onClick={(e) => e.stopPropagation()}>
            <AdminLock correctPassword={data.adminPassword} onUnlock={() => { setAdminUnlocked(true); setShowAdminLogin(false); }} />
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TimetablePortal />);
</script>
<script>
  // Manually run the JSX through Babel with the classic (React.createElement)
  // runtime, so no ES module import is needed for plain <script> execution.
  const src = document.getElementById("app-source").textContent;
  const { code } = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] });
  const tag = document.createElement("script");
  tag.textContent = code;
  document.body.appendChild(tag);
</script>
</body>
</html>
