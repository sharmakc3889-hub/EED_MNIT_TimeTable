function CurriculumManager({ cls, departments, subjects, faculty, assignments, allClasses, allAssignments, onAdd, onRemove, onCopyFrom, bare }) {
  const [subjectId, setSubjectId] = useState("");
  const [facultyId, setFacultyId] = useState("");
  const [batchId, setBatchId] = useState("");
  const [copyFromId, setCopyFromId] = useState("");

  const deptSubjects = subjects.filter((s) => !cls || s.departmentId === cls.departmentId);
  const subject = subjects.find((s) => s.id === subjectId);
  // Lab/tutorial/seminar subjects on a class with batches can be mapped to a
  // different faculty per batch — one assignment row per batch. Lab/tutorial
  // batches feed the same subject into a common slot when the timetable is
  // auto-generated; seminar batches (non-mapping) just get per-batch
  // supervisors, e.g. a different guide per M.Tech seminar batch.
  const batchEligible = subject && isBatchMappableType(subject.classType) && (cls?.batches?.length > 0);

  const usedBatchIdsFor = (sid) => new Set(assignments.filter((a) => a.subjectId === sid).map((a) => a.batchId).filter(Boolean));
  const fullyMapped = (sid) => {
    const s = subjects.find((x) => x.id === sid);
    const eligible = s && isBatchMappableType(s.classType) && (cls?.batches?.length > 0);
    if (eligible) return usedBatchIdsFor(sid).size >= cls.batches.length;
    return assignments.some((a) => a.subjectId === sid); // theory/plc: one mapping only
  };
  const available = deptSubjects.filter((s) => !fullyMapped(s.id));
  const batchOptions = batchEligible ? (cls.batches || []).filter((b) => !usedBatchIdsFor(subjectId).has(b.id)) : [];

  const submit = () => {
    if (!subjectId || !facultyId) return;
    if (batchEligible && !batchId) return;
    onAdd({ subjectId, facultyId, batchId: batchEligible ? batchId : null });
    setSubjectId("");
    setFacultyId("");
    setBatchId("");
  };

  // Other classes in the same department that already have a curriculum —
  // so the subject↔faculty mapping doesn't need to be typed in again.
  const sourceClasses = (allClasses || []).filter((c) => c.id !== cls?.id && c.departmentId === cls?.departmentId && (allAssignments || []).some((a) => a.classId === c.id));
  const bestMatch = sourceClasses.find((c) => c.program === cls?.program && c.semester === cls?.semester) || sourceClasses[0];
  const previewCount = (fromId) => (fromId && allClasses && allAssignments ? computeCopyableAssignments({ classes: allClasses, assignments: allAssignments, subjects }, fromId, cls?.id).length : 0);
  const suggestedCount = bestMatch ? previewCount(bestMatch.id) : 0;

  // Total hours/credits are de-duplicated per subject — parallel batches of
  // the same lab/tutorial still occupy just one common slot for the class.
  const uniqueSubjectIds = Array.from(new Set(assignments.map((a) => a.subjectId)));
  const totalHours = uniqueSubjectIds.reduce((sum, sid) => sum + (subjects.find((s) => s.id === sid)?.hoursPerWeek || 0), 0);
  const totalCredits = uniqueSubjectIds.reduce((sum, sid) => sum + (subjects.find((s) => s.id === sid)?.credits || 0), 0);

  const content = (
    <React.Fragment>
      {assignments.length === 0 && bestMatch && suggestedCount > 0 && (
        <p className="text-xs text-teal-700 bg-teal-50 border border-teal-200 rounded-lg px-3 py-2 mb-3 flex items-center justify-between gap-2">
          <span>This looks like <strong>{className(bestMatch, departments)}</strong> — reuse its {suggestedCount} mapping{suggestedCount === 1 ? "" : "s"}?</span>
          <button onClick={() => onCopyFrom(bestMatch.id)} className="shrink-0 bg-teal-600 hover:bg-teal-700 text-white text-xs px-2.5 py-1 rounded-lg">Apply</button>
        </p>
      )}
      {sourceClasses.length > 0 && (
        <div className="flex items-center gap-2 mb-3">
          <select value={copyFromId} onChange={(e) => setCopyFromId(e.target.value)} className="flex-1 text-xs border border-slate-300 rounded-lg px-2 py-1.5">
            <option value="">Copy mapping from another class…</option>
            {sourceClasses.map((c) => <option key={c.id} value={c.id}>{className(c, departments)} ({previewCount(c.id)} to copy)</option>)}
          </select>
          <button
            disabled={!copyFromId || previewCount(copyFromId) === 0}
            onClick={() => { onCopyFrom(copyFromId); setCopyFromId(""); }}
            className={`shrink-0 text-xs px-2.5 py-1.5 rounded-lg text-white ${copyFromId && previewCount(copyFromId) > 0 ? "bg-slate-700 hover:bg-slate-800" : "bg-slate-300 cursor-not-allowed"}`}
          >
            Copy
          </button>
        </div>
      )}
      <div className="grid grid-cols-2 gap-2 mb-2">
        <select value={subjectId} onChange={(e) => { setSubjectId(e.target.value); setBatchId(""); }} className="text-sm border border-slate-300 rounded-lg px-2 py-1.5 col-span-2">
          <option value="">Subject…</option>
          {available.map((s) => <option key={s.id} value={s.id}>{s.name}{subjectAbbr(s) && subjectAbbr(s) !== s.name ? ` (${subjectAbbr(s)})` : ""} — {typeLabel(s.classType)}</option>)}
        </select>
        <select value={facultyId} onChange={(e) => setFacultyId(e.target.value)} className={`text-sm border border-slate-300 rounded-lg px-2 py-1.5 ${batchEligible ? "" : "col-span-2"}`}>
          <option value="">Faculty…</option>
          {faculty.map((f) => <option key={f.id} value={f.id}>{f.name}</option>)}
        </select>
        {batchEligible && (
          <select value={batchId} onChange={(e) => setBatchId(e.target.value)} className="text-sm border border-slate-300 rounded-lg px-2 py-1.5">
            <option value="">Batch…</option>
            {batchOptions.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
          </select>
        )}
      </div>
      {batchEligible && <p className="text-[11px] text-slate-400 mb-2 -mt-1">This subject has batches — map each batch to its own faculty; they'll be auto-scheduled together in one common slot.</p>}
      <button onClick={submit} disabled={!subjectId || !facultyId || (batchEligible && !batchId)} className={`w-full rounded-lg px-3 py-1.5 text-sm font-medium flex items-center justify-center gap-1 mb-3 text-white ${subjectId && facultyId && (!batchEligible || batchId) ? "bg-teal-600 hover:bg-teal-700" : "bg-slate-300 cursor-not-allowed"}`}>
        <Plus className="w-4 h-4" /> Add mapping
      </button>
      <div className="space-y-1.5 max-h-40 overflow-y-auto pr-1">
        {assignments.length === 0 && <p className="text-xs text-slate-400 italic py-2">No subjects mapped to this class yet.</p>}
        {assignments.map((a) => {
          const subj = subjects.find((s) => s.id === a.subjectId);
          const fac = faculty.find((f) => f.id === a.facultyId);
          const batch = cls?.batches?.find((b) => b.id === a.batchId);
          const style = typeStyle(subj?.classType);
          return (
            <div key={a.id} className="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5">
              <span className="text-sm text-slate-700">
                {subj?.name}{subjectAbbr(subj) && subjectAbbr(subj) !== subj?.name && <span className="ml-1 text-[10px] text-slate-400">({subjectAbbr(subj)})</span>} <span className={`ml-1 text-xs px-1.5 py-0.5 rounded ${style.chip}`}>{typeLabel(subj?.classType)}</span>
                {batch && <span className="ml-1 text-xs px-1.5 py-0.5 rounded bg-violet-100 text-violet-700">{batch.name}</span>}
                <span className="text-slate-400 ml-2">{subj?.hoursPerWeek} hrs/wk · {fac?.name}</span>
              </span>
              <button onClick={() => onRemove(a.id)} className="text-slate-400 hover:text-red-600 shrink-0"><Trash2 className="w-3.5 h-3.5" /></button>
            </div>
          );
        })}
      </div>
    </React.Fragment>
  );

  if (bare) return content;

  return (
    <Section icon={ClipboardList} title="Subject ↔ faculty mapping" right={<span className="text-xs text-slate-400">{totalCredits} credits · {totalHours} hrs/wk</span>}>
      {content}
    </Section>
  );
}

function TimetableGrid({ periodsCount, entries, data, editable, onCellClick, onToggleFreeze, onDropEntries, classId }) {
  const bySubject = useMemo(() => Object.fromEntries(data.subjects.map((s) => [s.id, s])), [data.subjects]);
  const byFaculty = useMemo(() => Object.fromEntries(data.faculty.map((f) => [f.id, f])), [data.faculty]);
  const byRoom = useMemo(() => Object.fromEntries(data.rooms.map((r) => [r.id, r])), [data.rooms]);
  const byTechnician = useMemo(() => Object.fromEntries((data.technicians || []).map((t) => [t.id, t])), [data.technicians]);
  const byScholar = useMemo(() => Object.fromEntries((data.scholars || []).map((s) => [s.id, s])), [data.scholars]);

  const days = useMemo(() => getDays(data), [data.daysPerWeek]);
  const occupied = useMemo(() => computeOccupied(entries, days), [entries, days]);
  const sch = getScheduleForClass(data, classId);
  const [dragOverKey, setDragOverKey] = useState(null);

  const entriesAt = (day, period) => entries.filter((e) => e.day === day && e.period === period);

  const handleDragStart = (ev, items) => {
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", JSON.stringify(items.map((e) => e.id)));
  };
  const handleDrop = (ev, day, period) => {
    ev.preventDefault();
    setDragOverKey(null);
    if (!onDropEntries) return;
    let ids = [];
    try { ids = JSON.parse(ev.dataTransfer.getData("text/plain")); } catch { /* not a slot drag */ }
    if (ids.length) onDropEntries(ids, day, period);
  };

  return (
    <div className="grid border border-slate-200 rounded-xl overflow-hidden bg-white" style={{ gridTemplateColumns: `88px repeat(${days.length}, minmax(120px, 1fr))` }}>
      <div className="bg-slate-100 border-b border-r border-slate-200" />
      {days.map((d) => (
        <div key={d} className="bg-slate-100 border-b border-slate-200 text-center text-xs font-semibold text-slate-600 py-2">{d}</div>
      ))}
      {Array.from({ length: periodsCount }).map((_, p) => (
        <React.Fragment key={p}>
          <div className="border-r border-b border-slate-200 bg-slate-50 flex flex-col items-center justify-center py-2">
            <span className="text-xs font-semibold text-slate-500">P{p + 1}</span>
            <span className="text-[10px] text-slate-400">{periodLabel(p, sch)}</span>
          </div>
          {days.map((day) => {
            if (occupied[day].has(p)) return null;
            const cellEntries = entriesAt(day, p);
            const cellKey = `${day}-${p}`;
            const lunchEntry = cellEntries.find((e) => e.isLunch);
            if (lunchEntry) {
              return (
                <div key={day} style={{ gridRow: `span ${lunchEntry.span || 1}` }}
                  onClick={() => editable && onCellClick({ day, period: p, entry: lunchEntry })}
                  title={editable ? "Click to edit or remove this lunch break" : undefined}
                  className={`border-b border-r last:border-r-0 border-slate-200 bg-amber-50 flex items-center justify-center gap-1 min-h-16 ${editable ? "cursor-pointer hover:bg-amber-100" : ""}`}>
                  <Clock className="w-3.5 h-3.5 text-amber-600" />
                  <span className="text-xs font-semibold text-amber-700 uppercase tracking-wide">Lunch</span>
                </div>
              );
            }
            if (cellEntries.length === 0) {
              const isDragTarget = editable && !!onDropEntries && dragOverKey === cellKey;
              return (
                <button key={day} disabled={!editable} onClick={() => editable && onCellClick({ day, period: p })}
                  onDragOver={(ev) => { if (editable && onDropEntries) { ev.preventDefault(); if (dragOverKey !== cellKey) setDragOverKey(cellKey); } }}
                  onDragLeave={() => setDragOverKey((k) => (k === cellKey ? null : k))}
                  onDrop={(ev) => handleDrop(ev, day, p)}
                  className={`border-b border-r last:border-r-0 border-slate-200 min-h-16 flex items-center justify-center group ${editable ? "hover:bg-teal-50 cursor-pointer" : ""} ${isDragTarget ? "bg-teal-100 ring-2 ring-inset ring-teal-400" : ""}`}>
                  {editable && <Plus className="w-3.5 h-3.5 text-slate-300 group-hover:text-teal-500" />}
                </button>
              );
            }
            const cls = data.classes.find((c) => c.id === cellEntries[0].classId);
            const totalBatches = (cls?.batches || []).length;
            const usedBatchIds = new Set(cellEntries.map((e) => e.batchId).filter(Boolean));
            const wholeClassBooked = cellEntries.some((e) => !e.batchId);
            const canAddAnotherBatch = editable && !wholeClassBooked && totalBatches > 0 && usedBatchIds.size < totalBatches;
            const maxSpan = Math.max(...cellEntries.map((e) => e.span));
            const groups = groupCellEntries(cellEntries);
            return (
              <div key={day} style={{ gridRow: `span ${maxSpan}` }}
                className="relative border-b border-r last:border-r-0 border-slate-200 flex flex-col divide-y divide-slate-200/70">
                {groups.map((group) => {
                  const subject = bySubject[group.subjectId];
                  const style = typeStyle(subject?.classType);
                  const anyFrozen = group.items.some((e) => e.frozen);
                  const canDrag = editable && !!onDropEntries && !anyFrozen;
                  return (
                    <div
                      key={group.subjectId}
                      draggable={canDrag}
                      onDragStart={(ev) => canDrag && handleDragStart(ev, group.items)}
                      className={`relative flex-1 ${style.cell} ${anyFrozen ? "ring-2 ring-inset ring-slate-400" : ""} ${canDrag ? "cursor-grab active:cursor-grabbing" : ""}`}
                    >
                      <div className="w-full px-2 py-1.5 flex flex-col gap-0.5">
                        <div className="flex items-center justify-between gap-1">
                          <span className={`text-xs font-semibold leading-tight ${style.text}`}>{subjectAbbr(subject)}</span>
                          <span className="text-[9px] text-slate-400 uppercase tracking-wide shrink-0">{typeLabel(subject?.classType)}</span>
                        </div>
                        {group.items.map((entry) => {
                          const fac = byFaculty[entry.facultyId];
                          const room = byRoom[entry.roomId];
                          const batch = batchLabel(entry, data);
                          const isLab = subject?.classType === "lab";
                          // Technician names for this cell: the session-specific
                          // explicit pick or the lab's default in-charge (legacy,
                          // single technician), merged with every technician
                          // assigned to this exact room + batch combination via
                          // Setup > Lab/Batch ↔ technician assignment — deduplicated.
                          const legacyTechId = entry.technicianId || (isLab ? room?.technicianId : null);
                          const technicianNames = isLab
                            ? Array.from(new Set([
                                ...(legacyTechId ? [byTechnician[legacyTechId]?.name] : []),
                                ...(data.technicianAssignments || [])
                                  .filter((a) => a.roomId === entry.roomId && (a.batch || "") === batch)
                                  .map((a) => byTechnician[a.technicianId]?.name),
                              ].filter(Boolean)))
                            : [];
                          // Scholars aren't stored on the entry itself — look up
                          // whichever scholar(s) are assigned (Setup > Lab/Batch ↔
                          // scholar) to this exact room + batch combination.
                          const scholarNames = isLab
                            ? Array.from(new Set(
                                (data.scholarAssignments || [])
                                  .filter((a) => a.roomId === entry.roomId && (a.batch || "") === batch)
                                  .map((a) => byScholar[a.scholarId]?.name)
                                  .filter(Boolean)
                              ))
                            : [];
                          return (
                            <button key={entry.id} onClick={(ev) => { ev.stopPropagation(); editable && onCellClick({ day, period: p, entry }); }}
                              className={`w-full text-left rounded px-1 -mx-1 flex items-center justify-between gap-1 ${editable ? "hover:bg-black/5 cursor-pointer" : "cursor-default"}`}>
                              <span className="text-[11px] text-slate-600 truncate flex items-center gap-1">
                                {batch && <span className="font-semibold text-slate-700">{batch}: </span>}
                                {fac?.name}<span className="text-slate-400"> · {room?.name}</span>
                                {technicianNames.length > 0 && <span className="text-violet-500" title={`Technician: ${technicianNames.join(", ")}`}> · {technicianNames.join(", ")}</span>}
                                {scholarNames.length > 0 && <span className="text-fuchsia-500" title={`Scholar: ${scholarNames.join(", ")}`}> · {scholarNames.join(", ")}</span>}
                                {entry.comboId && <Users className="w-3 h-3 text-slate-400 shrink-0" title="Combined with other classes" />}
                              </span>
                              {editable && onToggleFreeze && (
                                <span
                                  onClick={(evv) => { evv.stopPropagation(); onToggleFreeze(entry.id); }}
                                  title={entry.frozen ? "Unfreeze slot" : "Freeze slot"}
                                  className={`shrink-0 rounded p-0.5 ${entry.frozen ? "bg-slate-600 text-white" : "text-slate-400 hover:text-slate-700"}`}
                                >
                                  {entry.frozen ? <Lock className="w-3 h-3" /> : <Unlock className="w-3 h-3" />}
                                </span>
                              )}
                              {!editable && entry.frozen && <Lock className="w-3 h-3 text-slate-500 shrink-0" />}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
                {canAddAnotherBatch && (
                  <button
                    onClick={() => onCellClick({ day, period: p, addBatch: true })}
                    title="Add another batch in this slot"
                    className="flex items-center justify-center gap-1 py-1 text-[10px] text-teal-600 hover:bg-teal-50"
                  >
                    <Plus className="w-3 h-3" /> Batch
                  </button>
                )}
              </div>
            );
          })}
          {sch.lunchEnabled && p + 1 === sch.lunchAfter && (
            <div className="col-span-full bg-amber-50 border-b border-slate-200 flex items-center justify-center gap-2 py-1.5">
              <span className="text-xs font-semibold text-amber-700 uppercase tracking-wide">Lunch break</span>
              <span className="text-[10px] text-amber-600">{lunchTimeLabel(sch)}</span>
            </div>
          )}
        </React.Fragment>
      ))}
    </div>
  );
}

function CellModal({ context, data, onClose, onSave, onDelete }) {
  const { day, period, entry } = context;
  const [subjectId, setSubjectId] = useState(entry?.subjectId || "");
  const [facultyId, setFacultyId] = useState(entry?.facultyId || "");
  const [roomId, setRoomId] = useState(entry?.roomId || "");
  const [technicianId, setTechnicianId] = useState(entry?.technicianId || "");
  const [span, setSpan] = useState(entry?.span || 1);
  const [frozen, setFrozen] = useState(entry?.frozen || false);
  const [batchId, setBatchId] = useState(entry?.batchId || "");
  const [bulkMode, setBulkMode] = useState(!!context.addBatch);
  const [bulkRows, setBulkRows] = useState({}); // batchId -> { subjectId, facultyId, roomId }
  const [crossRows, setCrossRows] = useState([]); // [{ rowId, classId, subjectId, facultyId, roomId }] — other classes sharing this slot, each in its own room
  // Lunch-break mode: marks this one day/period/class cell as a break instead
  // of a subject slot — lets lunch be placed on a per-cell (and so per-day,
  // per-class) basis on top of the institute/classwise default in Setup.
  const [lunchMode, setLunchMode] = useState(!!entry?.isLunch);
  const [lunchSpan, setLunchSpan] = useState(entry?.span || 1);

  const sch = getScheduleForClass(data, context.classId);
  const cls = data.classes.find((c) => c.id === context.classId);
  const subject = data.subjects.find((s) => s.id === subjectId);
  const subjectOptions = data.subjects.filter((s) => (!cls || s.departmentId === cls.departmentId) && !isNonMappingType(s.classType));

  useEffect(() => {
    const multi = isMultiPeriodType(subject?.classType);
    if (multi && span < 2) setSpan(2);
    if (subject && !multi) setSpan(1);
  }, [subjectId]);

  const multi = isMultiPeriodType(subject?.classType);
  const maxSpan = Math.min(multi ? 3 : 1, data.periodsCount - period);

  // Lab/tutorial sessions can be split into parallel batches (see Setup > Classes).
  // Batches already used in this exact day/period/class slot can't be picked again.
  const batchEligible = subject && (subject.classType === "lab" || subject.classType === "tutorial") && (cls?.batches?.length > 0);
  const otherEntriesHere = data.entries.filter((e) => e.classId === context.classId && e.day === day && e.period === period && e.id !== entry?.id);
  const usedBatchIds = new Set(otherEntriesHere.map((e) => e.batchId).filter(Boolean));
  const batchOptions = (cls?.batches || []).filter((b) => b.id === batchId || !usedBatchIds.has(b.id));
  const batchTaken = !!batchId && usedBatchIds.has(batchId);
  const wholeClassConflict = batchEligible && !batchId && otherEntriesHere.length > 0;

  // A sibling batch of this same lab/tutorial slot that uses the exact same
  // faculty AND the exact same room isn't a clash — it's a merged session,
  // e.g. one faculty running two batches together in one lab/classroom.
  const isMergedBatchMate = (conflictEntry, fId, rId) =>
    batchEligible && !!conflictEntry && otherEntriesHere.some((e) => e.id === conflictEntry.id) &&
    conflictEntry.facultyId === fId && conflictEntry.roomId === rId;

  const conflicts = (() => {
    if (!facultyId && !roomId) return {};
    const raw = findConflicts(data.entries, { day, period, span, facultyId, roomId, excludeId: entry?.id });
    return {
      facultyConflict: raw.facultyConflict && !isMergedBatchMate(raw.facultyConflict, facultyId, roomId) ? raw.facultyConflict : undefined,
      roomConflict: raw.roomConflict && !isMergedBatchMate(raw.roomConflict, facultyId, roomId) ? raw.roomConflict : undefined,
    };
  })();

  const relevantRooms = useMemo(
    () => (subject ? data.rooms.filter((r) => (needsLabRoom(subject.classType) ? r.type === "lab" : true)) : data.rooms),
    [subject, data.rooms]
  );

  // Technician assignment only makes sense for laboratory sessions. Prefill
  // from the room's assigned in-charge technician (Setup > Lab ↔ technician
  // assignment) when a lab room is picked, but never overwrite a choice the
  // user already made for this entry.
  const isLabClass = subject?.classType === "lab";
  useEffect(() => {
    if (!isLabClass || technicianId) return;
    const room = data.rooms.find((r) => r.id === roomId);
    if (room?.technicianId) setTechnicianId(room.technicianId);
  }, [roomId, isLabClass]);

  // Remaining, still-unscheduled batches available for bulk fill in this slot.
  const remainingBatches = (cls?.batches || []).filter((b) => !usedBatchIds.has(b.id));
  const canBulk = !entry && batchEligible && remainingBatches.length > 1;

  // Batches can each run a different lab/tutorial subject in this same slot
  // (e.g. Batch 1 does a Networks lab, Batch 2 does a DBMS lab, at once) — so
  // every row gets its own subject picker, defaulting to the subject chosen above.
  const sameTypeSubjectOptions = data.subjects.filter((s) => s.departmentId === cls?.departmentId && s.classType === subject?.classType);

  // Prefill each batch row's subject (from the one picked above) and faculty
  // from the curriculum mapping (subject ↔ batch ↔ faculty from Build
  // timetable > Subject ↔ faculty mapping), if set.
  useEffect(() => {
    if (!bulkMode) return;
    const next = {};
    remainingBatches.forEach((b) => {
      const mapped = data.assignments.find((a) => a.classId === context.classId && a.subjectId === subjectId && a.batchId === b.id);
      next[b.id] = { subjectId, facultyId: mapped?.facultyId || "", roomId: "", technicianId: "" };
    });
    setBulkRows(next);
  }, [bulkMode, subjectId]);

  const setBulkField = (batchIdKey, field, value) => {
    setBulkRows((prev) => {
      const current = prev[batchIdKey] || { subjectId, facultyId: "", roomId: "", technicianId: "" };
      if (field === "subjectId") {
        // Re-derive the mapped faculty for the newly picked subject, and
        // clear the room/technician since a different lab subject may need a different venue.
        const mapped = data.assignments.find((a) => a.classId === context.classId && a.subjectId === value && a.batchId === batchIdKey);
        return { ...prev, [batchIdKey]: { subjectId: value, facultyId: mapped?.facultyId || "", roomId: "", technicianId: "" } };
      }
      if (field === "roomId") {
        // Prefill the room's assigned technician for lab subjects, without overwriting a choice already made.
        const rowSubject = data.subjects.find((s) => s.id === current.subjectId);
        const roomTechnicianId = data.rooms.find((rm) => rm.id === value)?.technicianId || "";
        const technicianId = rowSubject?.classType === "lab" && !current.technicianId ? roomTechnicianId : current.technicianId;
        return { ...prev, [batchIdKey]: { ...current, roomId: value, technicianId } };
      }
      return { ...prev, [batchIdKey]: { ...current, [field]: value } };
    });
  };

  const bulkFilledRows = remainingBatches
    .map((b) => ({ batch: b, ...(bulkRows[b.id] || { subjectId, facultyId: "", roomId: "", technicianId: "" }) }))
    .filter((r) => r.subjectId && r.facultyId && r.roomId);
  // Same rule as single-batch editing: two batch rows sharing the exact same
  // faculty+room pair are a merged session, not a clash. Only a same-room
  // *different*-faculty or same-faculty *different*-room pairing is invalid.
  const bulkRoomDupe = bulkFilledRows.some((p, i) => bulkFilledRows.some((q, j) => i !== j && p.roomId === q.roomId && p.facultyId !== q.facultyId));
  const bulkFacultyDupe = bulkFilledRows.some((p, i) => bulkFilledRows.some((q, j) => i !== j && p.facultyId === q.facultyId && p.roomId !== q.roomId));
  const bulkExternalConflict = bulkFilledRows.some((r) => {
    const c = findConflicts(data.entries, { day, period, span, facultyId: r.facultyId, roomId: r.roomId, excludeId: entry?.id });
    const facultyClash = c.facultyConflict && !isMergedBatchMate(c.facultyConflict, r.facultyId, r.roomId);
    const roomClash = c.roomConflict && !isMergedBatchMate(c.roomConflict, r.facultyId, r.roomId);
    return facultyClash || roomClash;
  });
  const canSaveBulk = bulkFilledRows.length >= 2 && !bulkRoomDupe && !bulkFacultyDupe && !bulkExternalConflict;

  // "Combine with other classes" — lets this slot also seat students from
  // other classes at the same day/period, each in their own room (e.g. an
  // Open Elective pooled across classes, or any joint session split by room).
  const canCombine = !entry && !bulkMode;
  const addCrossRow = () => setCrossRows((prev) => [...prev, { rowId: uid(), classId: "", subjectId: "", facultyId: "", roomId: "", technicianId: "" }]);
  const removeCrossRow = (rowId) => setCrossRows((prev) => prev.filter((r) => r.rowId !== rowId));
  const updateCrossRow = (rowId, field, value) => setCrossRows((prev) => prev.map((r) => {
    if (r.rowId !== rowId) return r;
    const next = { ...r, [field]: value };
    if (field === "classId") { next.subjectId = ""; next.facultyId = ""; next.roomId = ""; }
    if (field === "subjectId") { next.roomId = ""; }
    return next;
  }));
  const usedCrossClassIds = new Set(crossRows.map((r) => r.classId).filter(Boolean));
  const crossClassOptionsFor = (rowId) => data.classes.filter((c) => c.id !== context.classId && (c.id === crossRows.find((r) => r.rowId === rowId)?.classId || !usedCrossClassIds.has(c.id)));
  const crossSubjectOptionsFor = (rowClassId) => {
    const rowClass = data.classes.find((c) => c.id === rowClassId);
    return data.subjects.filter((s) => (!rowClass || s.departmentId === rowClass.departmentId) && !isNonMappingType(s.classType));
  };
  const crossRoomOptionsFor = (rowSubjectId) => {
    const rowSubject = data.subjects.find((s) => s.id === rowSubjectId);
    return rowSubject ? data.rooms.filter((r) => (needsLabRoom(rowSubject.classType) ? r.type === "lab" : true)) : data.rooms;
  };
  const crossFilledRows = crossRows.filter((r) => r.classId && r.subjectId && r.facultyId && r.roomId);
  const crossIncomplete = crossRows.some((r) => (r.classId || r.subjectId || r.facultyId || r.roomId) && !(r.classId && r.subjectId && r.facultyId && r.roomId));
  // Faculty/room pairs across the primary row + every combined class. Two
  // different classes are allowed to share the SAME faculty in the SAME room
  // at this slot (e.g. one teacher holding a joint session for both classes
  // in one classroom) — that's not a clash, it's the same physical session.
  // What's never allowed: the same room with a *different* faculty (two
  // teachers can't share one room at once), or the same faculty in a
  // *different* room (one teacher can't be in two rooms at once).
  const allPairs = [{ facultyId, roomId }, ...crossFilledRows.map((r) => ({ facultyId: r.facultyId, roomId: r.roomId }))].filter(
    (p) => p.facultyId && p.roomId
  );
  const crossRoomDupe = allPairs.some((p, i) => allPairs.some((q, j) => i !== j && p.roomId === q.roomId && p.facultyId !== q.facultyId));
  const crossFacultyDupe = allPairs.some((p, i) => allPairs.some((q, j) => i !== j && p.facultyId === q.facultyId && p.roomId !== q.roomId));
  const crossExternalConflict = crossFilledRows.some((r) => {
    const c = findConflicts(data.entries, { day, period, span, facultyId: r.facultyId, roomId: r.roomId });
    return c.facultyConflict || c.roomConflict;
  });
  const combining = crossFilledRows.length > 0;
  const canSaveCombo = subjectId && facultyId && roomId && !conflicts.facultyConflict && !conflicts.roomConflict &&
    combining && !crossIncomplete && !crossRoomDupe && !crossFacultyDupe && !crossExternalConflict;

  const locked = !!entry && frozen;
  const canSave = !locked && subjectId && facultyId && roomId && !conflicts.facultyConflict && !conflicts.roomConflict && !batchTaken && !wholeClassConflict;
  const maxLunchSpan = Math.max(1, Math.min(3, data.periodsCount - period));

  if (lunchMode) {
    return (
      <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50 p-4">
        <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm p-5">
          <div className="flex items-center justify-between mb-4">
            <div>
              <h3 className="text-sm font-semibold text-slate-800">{day}, Period {period + 1}</h3>
              <p className="text-xs text-slate-400">{periodLabel(period, sch)} · {className(cls, data.departments)}</p>
            </div>
            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5" /></button>
          </div>

          <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-3 flex items-start gap-2 mb-4">
            <Clock className="w-4 h-4 text-amber-600 shrink-0 mt-0.5" />
            <p className="text-xs text-amber-700">
              This slot will be marked as a <span className="font-semibold">Lunch Break</span> for {className(cls, data.departments)} on {day} only —
              it won't be available for scheduling classes, and other days keep their own lunch timing.
            </p>
          </div>

          <div className="mb-2">
            <label className="text-xs font-medium text-slate-500 block mb-1">Duration ({lunchSpan} period{lunchSpan > 1 ? "s" : ""})</label>
            <input type="range" min={1} max={maxLunchSpan} step={1} value={lunchSpan} onChange={(e) => setLunchSpan(Number(e.target.value))} className="w-full" />
          </div>

          {!entry && (
            <button onClick={() => setLunchMode(false)} className="text-xs text-teal-600 hover:text-teal-700 underline mt-1">
              ← Back to scheduling a class instead
            </button>
          )}

          <div className="flex items-center justify-between mt-5">
            <div>
              {entry && (
                <button onClick={() => onDelete(entry.id)} className="text-sm text-red-600 hover:text-red-700 flex items-center gap-1">
                  <Trash2 className="w-4 h-4" /> Remove lunch break
                </button>
              )}
            </div>
            <div className="flex gap-2">
              <button onClick={onClose} className="text-sm px-3 py-1.5 rounded-lg border border-slate-300 text-slate-600">Cancel</button>
              <button
                onClick={() => onSave({ id: entry?.id || uid(), classId: context.classId, day, period, span: lunchSpan, isLunch: true, subjectId: null, facultyId: null, roomId: null, frozen: false, batchId: null })}
                className="text-sm px-4 py-1.5 rounded-lg text-white bg-amber-600 hover:bg-amber-700 flex items-center gap-1"
              >
                <Check className="w-4 h-4" /> Save
              </button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-5">
        <div className="flex items-center justify-between mb-4">
          <div>
            <h3 className="text-sm font-semibold text-slate-800 flex items-center gap-1.5">
              {day}, Period {period + 1}
              {entry && (
                <span className={`text-[10px] px-1.5 py-0.5 rounded ${frozen ? "bg-slate-600 text-white" : "bg-slate-100 text-slate-500"}`}>{frozen ? "Frozen" : "Editable"}</span>
              )}
            </h3>
            <p className="text-xs text-slate-400">{periodLabel(period, sch)} · {className(cls, data.departments)}</p>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5" /></button>
        </div>

        {locked && (
          <p className="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 mb-3 flex items-center gap-1.5">
            <AlertTriangle className="w-3.5 h-3.5 shrink-0" /> This slot is frozen and protected from edits and auto-generation. Unfreeze it to make changes.
          </p>
        )}

        <div className="space-y-3">
          <div>
            <label className="text-xs font-medium text-slate-500 block mb-1">Subject</label>
            <select disabled={locked} value={subjectId} onChange={(e) => setSubjectId(e.target.value)} className="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 disabled:bg-slate-100 disabled:text-slate-400">
              <option value="">Select subject…</option>
              {subjectOptions.map((s) => <option key={s.id} value={s.id}>{s.name} ({typeLabel(s.classType)})</option>)}
            </select>
          </div>

          {canBulk && (
            <button
              onClick={() => setBulkMode((v) => !v)}
              className={`w-full text-xs px-3 py-2 rounded-lg border flex items-center justify-center gap-1.5 ${bulkMode ? "border-teal-400 bg-teal-50 text-teal-700" : "border-slate-300 text-slate-600 hover:bg-slate-50"}`}
            >
              <Layers className="w-3.5 h-3.5" /> {bulkMode ? "Filling all batches at once" : `Fill all ${remainingBatches.length} batches at once`}
            </button>
          )}

          {!entry && !context.addBatch && !bulkMode && (
            <button
              onClick={() => setLunchMode(true)}
              className="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-amber-50 hover:border-amber-300 hover:text-amber-700 flex items-center justify-center gap-1.5"
            >
              <Clock className="w-3.5 h-3.5" /> Mark this slot as Lunch Break instead
            </button>
          )}

          {bulkMode && canBulk ? (
            <div className="space-y-2">
              <p className="text-[11px] text-slate-400">Assign a subject, faculty, and room to each batch — they'll all be scheduled together in this common slot. Batches can run different labs.</p>
              {remainingBatches.map((b) => {
                const row = bulkRows[b.id] || { subjectId, facultyId: "", roomId: "", technicianId: "" };
                const rowIsLab = data.subjects.find((s) => s.id === row.subjectId)?.classType === "lab";
                return (
                  <div key={b.id} className="border border-slate-200 rounded-lg p-2">
                    <p className="text-xs font-semibold text-slate-600 mb-1">{b.name}</p>
                    <select value={row.subjectId} onChange={(e) => setBulkField(b.id, "subjectId", e.target.value)} className="w-full text-sm border border-slate-300 rounded-lg px-2 py-1.5 mb-1.5">
                      <option value="">Subject…</option>
                      {sameTypeSubjectOptions.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                    <div className="grid grid-cols-2 gap-2">
                      <select value={row.facultyId} onChange={(e) => setBulkField(b.id, "facultyId", e.target.value)} className="text-sm border border-slate-300 rounded-lg px-2 py-1.5">
                        <option value="">Faculty…</option>
                        {data.faculty.map((f) => <option key={f.id} value={f.id}>{f.name}</option>)}
                      </select>
                      <select value={row.roomId} onChange={(e) => setBulkField(b.id, "roomId", e.target.value)} className="text-sm border border-slate-300 rounded-lg px-2 py-1.5">
                        <option value="">Room…</option>
                        {relevantRooms.map((r) => <option key={r.id} value={r.id}>{r.name} ({r.type})</option>)}
                      </select>
                    </div>
                    {rowIsLab && (
                      <select value={row.technicianId || ""} onChange={(e) => setBulkField(b.id, "technicianId", e.target.value)} className="w-full text-sm border border-slate-300 rounded-lg px-2 py-1.5 mt-1.5">
                        <option value="">No technician</option>
                        {data.technicians.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
                      </select>
                    )}
                  </div>
                );
              })}
              {bulkFacultyDupe && <p className="text-xs text-red-600 flex items-center gap-1"><AlertTriangle className="w-3.5 h-3.5" /> The same faculty can't be in two different rooms at once — use the same room too if it's a merged session.</p>}
              {bulkRoomDupe && <p className="text-xs text-red-600 flex items-center gap-1"><AlertTriangle className="w-3.5 h-3.5" /> This room already has a different faculty picked for another batch — use the same faculty too if it's a merged session.</p>}
              {bulkExternalConflict && <p className="text-xs text-red-600 flex items-center gap-1"><AlertTriangle className="w-3.5 h-3.5" /> One of these faculty/rooms is already booked elsewhere at this time.</p>}
              {multi && (
                <div>
                  <label className="text-xs font-medium text-slate-500 block mb-1">Duration ({span} period{span > 1 ? "s" : ""})</label>
                  <input type="range" min={1} max={Math.max(1, maxSpan)} step={1} value={span} onChange={(e) => setSpan(Number(e.target.value))} className="w-full" />
                </div>
              )}
            </div>
          ) : (
            <React.Fragment>
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1">Faculty</label>
                <select disabled={locked} value={facultyId} onChange={(e) => setFacultyId(e.target.value)} className="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 disabled:bg-slate-100 disabled:text-slate-400">
                  <option value="">Select faculty…</option>
                  {data.faculty.map((f) => <option key={f.id} value={f.id}>{f.name}</option>)}
                </select>
                {conflicts.facultyConflict && (
                  <p className="text-xs text-red-600 mt-1 flex items-center gap-1">
                    <AlertTriangle className="w-3.5 h-3.5" />
                    Already teaching {className(data.classes.find((c) => c.id === conflicts.facultyConflict.classId), data.departments)} at this time
                  </p>
                )}
              </div>
              <div>
                <label className="text-xs font-medium text-slate-500 block mb-1">Room</label>
                <select disabled={locked} value={roomId} onChange={(e) => setRoomId(e.target.value)} className="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 disabled:bg-slate-100 disabled:text-slate-400">
                  <option value="">Select room…</option>
                  {relevantRooms.map((r) => <option key={r.id} value={r.id}>{r.name} ({r.type})</option>)}
                </select>
                {conflicts.roomConflict && (
                  <p className="text-xs text-red-600 mt-1 flex items-center gap-1">
                    <AlertTriangle className="w-3.5 h-3.5" />
                    Already booked by {className(data.classes.find((c) => c.id === conflicts.roomConflict.classId), data.departments)} at this time
                  </p>
                )}
              </div>
              {isLabClass && (
                <div>
                  <label className="text-xs font-medium text-slate-500 block mb-1">Technician (optional)</label>
                  <select disabled={locked} value={technicianId} onChange={(e) => setTechnicianId(e.target.value)} className="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 disabled:bg-slate-100 disabled:text-slate-400">
                    <option value="">No technician</option>
                    {data.technicians.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
                  </select>
                </div>
              )}
              {multi && (
                <div>
                  <label className="text-xs font-medium text-slate-500 block mb-1">Duration ({span} period{span > 1 ? "s" : ""})</label>
                  <input disabled={locked} type="range" min={1} max={Math.max(1, maxSpan)} step={1} value={span} onChange={(e) => setSpan(Number(e.target.value))} className="w-full disabled:opacity-50" />
                </div>
              )}
              {batchEligible && (
                <div>
                  <label className="text-xs font-medium text-slate-500 block mb-1">Batch</label>
                  <select disabled={locked} value={batchId} onChange={(e) => setBatchId(e.target.value)} className="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 disabled:bg-slate-100 disabled:text-slate-400">
                    <option value="">Whole class (no batch split)</option>
                    {batchOptions.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
                  </select>
                  {batchTaken && (
                    <p className="text-xs text-red-600 mt-1 flex items-center gap-1"><AlertTriangle className="w-3.5 h-3.5" /> That batch already has a session in this slot.</p>
                  )}
                  {wholeClassConflict && (
                    <p className="text-xs text-red-600 mt-1 flex items-center gap-1"><AlertTriangle className="w-3.5 h-3.5" /> This slot already has batch-specific sessions — pick a batch instead of the whole class.</p>
                  )}
                  <p className="text-[11px] text-slate-400 mt-1">Pick a batch to run this session in parallel with other batches at the same time — e.g. separate lab groups with different faculty/rooms.</p>
                </div>
              )}

              {canCombine && (
                <div className="border-t border-slate-200 pt-3">
                  {crossRows.length === 0 ? (
                    <button
                      onClick={addCrossRow}
                      className="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50 flex items-center justify-center gap-1.5"
                    >
                      <Users className="w-3.5 h-3.5" /> Combine with other classes in this slot
                    </button>
                  ) : (
                    <div className="space-y-2">
                      <p className="text-[11px] text-slate-400">Other classes sharing this day/period — each needs its own subject, faculty, and room.</p>
                      {crossRows.map((row) => {
                        const rowClassOptions = crossClassOptionsFor(row.rowId);
                        const rowSubjectOptions = crossSubjectOptionsFor(row.classId);
                        const rowRoomOptions = crossRoomOptionsFor(row.subjectId);
                        const rowIsLab = data.subjects.find((s) => s.id === row.subjectId)?.classType === "lab";
                        return (
                          <div key={row.rowId} className="border border-slate-200 rounded-lg p-2 space-y-1.5">
                            <div className="flex items-center gap-2">
                              <select value={row.classId} onChange={(e) => updateCrossRow(row.rowId, "classId", e.target.value)} className="flex-1 text-sm border border-slate-300 rounded-lg px-2 py-1.5">
                                <option value="">Class…</option>
                                {rowClassOptions.map((c) => <option key={c.id} value={c.id}>{className(c, data.departments)}</option>)}
                              </select>
                              <button onClick={() => removeCrossRow(row.rowId)} className="text-slate-400 hover:text-red-600 shrink-0"><X className="w-4 h-4" /></button>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                              <select value={row.subjectId} onChange={(e) => updateCrossRow(row.rowId, "subjectId", e.target.value)} disabled={!row.classId} className="text-sm border border-slate-300 rounded-lg px-2 py-1.5 disabled:bg-slate-100">
                                <option value="">Subject…</option>
                                {rowSubjectOptions.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
                              </select>
                              <select value={row.facultyId} onChange={(e) => updateCrossRow(row.rowId, "facultyId", e.target.value)} disabled={!row.subjectId} className="text-sm border border-slate-300 rounded-lg px-2 py-1.5 disabled:bg-slate-100">
                                <option value="">Faculty…</option>
                                {data.faculty.map((f) => <option key={f.id} value={f.id}>{f.name}</option>)}
                              </select>
                            </div>
                            <select value={row.roomId} onChange={(e) => updateCrossRow(row.rowId, "roomId", e.target.value)} disabled={!row.subjectId} className="w-full text-sm border border-slate-300 rounded-lg px-2 py-1.5 disabled:bg-slate-100">
                              <option value="">Room…</option>
                              {rowRoomOptions.map((r) => <option key={r.id} value={r.id}>{r.name} ({r.type})</option>)}
                            </select>
                            {rowIsLab && (
                              <select value={row.technicianId || ""} onChange={(e) => updateCrossRow(row.rowId, "technicianId", e.target.value)} className="w-full text-sm border border-slate-300 rounded-lg px-2 py-1.5">
                                <option value="">No technician</option>
                                {data.technicians.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
                              </select>
                            )}
                          </div>
                        );
                      })}
                      <button onClick={addCrossRow} className="w-full text-xs px-3 py-1.5 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50 flex items-center justify-center gap-1.5">
                        <Plus className="w-3.5 h-3.5" /> Add another class
                      </button>
                      {crossIncomplete && <p className="text-xs text-red-600 flex items-center gap-1"><AlertTriangle className="w-3.5 h-3.5" /> Finish or remove the incomplete class row.</p>}
                      {crossFacultyDupe && <p className="text-xs text-red-600 flex items-center gap-1"><AlertTriangle className="w-3.5 h-3.5" /> The same faculty can't be in two different rooms at once — use the same room too if it's a joint session.</p>}
                      {crossRoomDupe && <p className="text-xs text-red-600 flex items-center gap-1"><AlertTriangle className="w-3.5 h-3.5" /> This room already has a different faculty at this slot — use the same faculty too if it's a joint session.</p>}
                      {crossExternalConflict && <p className="text-xs text-red-600 flex items-center gap-1"><AlertTriangle className="w-3.5 h-3.5" /> One of these faculty/rooms is already booked elsewhere at this time.</p>}
                    </div>
                  )}
                </div>
              )}
            </React.Fragment>
          )}
        </div>

        <div className="flex items-center justify-between mt-5">
          <div className="flex items-center gap-2">
            {entry && (
              <button
                onClick={() => setFrozen((v) => !v)}
                className={`text-sm px-3 py-1.5 rounded-lg border flex items-center gap-1 ${frozen ? "border-slate-400 bg-slate-100 text-slate-700" : "border-slate-300 text-slate-600"}`}
              >
                {frozen ? <Unlock className="w-3.5 h-3.5" /> : <Lock className="w-3.5 h-3.5" />} {frozen ? "Unfreeze" : "Freeze"}
              </button>
            )}
            {entry && (
              <button disabled={locked} onClick={() => onDelete(entry.id)} className="text-sm text-red-600 hover:text-red-700 disabled:text-slate-300 flex items-center gap-1"><Trash2 className="w-4 h-4" /> Remove</button>
            )}
          </div>
          <div className="flex gap-2">
            <button onClick={onClose} className="text-sm px-3 py-1.5 rounded-lg border border-slate-300 text-slate-600">Cancel</button>
            {bulkMode && canBulk ? (
              <button
                disabled={!canSaveBulk}
                onClick={() => onSave(bulkFilledRows.map((r) => ({
                  id: uid(), classId: context.classId, day, period, span, subjectId: r.subjectId,
                  facultyId: r.facultyId, roomId: r.roomId, frozen: false, batchId: r.batch.id,
                  technicianId: data.subjects.find((s) => s.id === r.subjectId)?.classType === "lab" && r.technicianId ? r.technicianId : null,
                })))}
                className={`text-sm px-4 py-1.5 rounded-lg text-white flex items-center gap-1 ${canSaveBulk ? "bg-teal-600 hover:bg-teal-700" : "bg-slate-300 cursor-not-allowed"}`}
              >
                <Check className="w-4 h-4" /> Save {bulkFilledRows.length} batch{bulkFilledRows.length === 1 ? "" : "es"}
              </button>
            ) : combining ? (
              <button
                disabled={!canSaveCombo}
                onClick={() => {
                  const comboId = uid();
                  const mainEntry = { id: uid(), classId: context.classId, day, period, span, subjectId, facultyId, roomId, frozen: false, batchId: batchEligible && batchId ? batchId : null, technicianId: isLabClass && technicianId ? technicianId : null, comboId };
                  const crossEntries = crossFilledRows.map((r) => ({ id: uid(), classId: r.classId, day, period, span, subjectId: r.subjectId, facultyId: r.facultyId, roomId: r.roomId, frozen: false, batchId: null, technicianId: data.subjects.find((s) => s.id === r.subjectId)?.classType === "lab" && r.technicianId ? r.technicianId : null, comboId }));
                  onSave([mainEntry, ...crossEntries]);
                }}
                className={`text-sm px-4 py-1.5 rounded-lg text-white flex items-center gap-1 ${canSaveCombo ? "bg-teal-600 hover:bg-teal-700" : "bg-slate-300 cursor-not-allowed"}`}
              >
                <Check className="w-4 h-4" /> Save {crossFilledRows.length + 1} classes
              </button>
            ) : (
              <button
                disabled={!canSave}
                onClick={() => onSave({ id: entry?.id || uid(), classId: context.classId, day, period, span, subjectId, facultyId, roomId, frozen, batchId: batchEligible && batchId ? batchId : null, technicianId: isLabClass && technicianId ? technicianId : null })}
                className={`text-sm px-4 py-1.5 rounded-lg text-white flex items-center gap-1 ${canSave ? "bg-teal-600 hover:bg-teal-700" : "bg-slate-300 cursor-not-allowed"}`}
              >
                <Check className="w-4 h-4" /> Save
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}
